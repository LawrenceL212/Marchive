    privateEssays: [],
    posts: [],
    modal: null,            // null | 'compose' | 'auth' | 'settings' | 'people' | 'messages'
    authMode: 'login',      // 'login' | 'signup'
    authError: null,
    authBusy: false,
    composeTab: 'essay',
    openEssayId: null,
    banner: null,
    myFollowing: {},         // { targetUid: true }
    myFollowers: {},         // { followerUid: true }
    networkTab: 'following', // 'following' | 'followers'
    networkFollowing: [],    // [{ uid, username }]
    networkFollowers: [],    // [{ uid, username }]
    networkLoading: false,
    peopleResults: [],       // [{ username, uid }]
    peopleSearched: false,
    conversations: [],       // [{ uid, username, lastMessage, lastAt }]
    activeConversationUid: null,
    activeConversationUsername: null,
    activeMessages: [],      // [{ id, from, to, text, createdAt }]
    messageDraft: '',
    page: null,               // null | { type: 'view'|'edit', essay: essayObj|null }
  };

  let listenersAttached = { publicEssays:false, posts:false, privateEssays:null, profile:null, follows:null, followersList:null, conversations:null, thread:null };
  let convosInitialized = false;
  let lastKnownConvoAt = {}; // otherUid -> last seen lastAt, for detecting genuinely new incoming messages

  function el(tag, props, ...kids){
    const node = document.createElement(tag);
    if(props){
      for(const k in props){
        if(k === 'class') node.className = props[k];
        else if(k.startsWith('on') && typeof props[k] === 'function'){
          node.addEventListener(k.slice(2).toLowerCase(), props[k]);
        } else if(k === 'html'){
          node.innerHTML = props[k];
        } else {
          node.setAttribute(k, props[k]);
        }
      }
    }
    kids.flat().forEach(kid => {
      if(kid === null || kid === undefined || kid === false) return;
      if(typeof kid === 'string' || typeof kid === 'number') node.appendChild(document.createTextNode(kid));
      else node.appendChild(kid);
    });
    return node;
  }

  const FONT_OPTIONS = [
    { id: 'lora',         label: 'Lora (default)',   family: "'Lora', serif" },
    { id: 'source-serif', label: 'Source Serif',      family: "'Source Serif 4', serif" },
    { id: 'merriweather', label: 'Merriweather',      family: "'Merriweather', serif" },
    { id: 'playfair',     label: 'Playfair Display',  family: "'Playfair Display', serif" },
    { id: 'georgia',      label: 'Georgia',           family: "Georgia, 'Times New Roman', serif" },
    { id: 'inter',        label: 'Inter (sans)',      family: "'Inter', -apple-system, sans-serif" },
    { id: 'mono',         label: 'Typewriter (mono)', family: "'JetBrains Mono', monospace" },
  ];

  function fontFamilyFor(fontId){
    const match = FONT_OPTIONS.find(f => f.id === fontId);
    return match ? match.family : FONT_OPTIONS[0].family;
  }

  const ICONS = {
    search: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>`,
    heart: (filled) => `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7"><path d="M12 20.5s-7.5-4.6-10-9.3C0.3 8 1.6 4.6 4.8 3.6c2.2-0.7 4.4 0.2 5.7 2 .5.7 1 1.5 1.5 2.2.5-.7 1-1.5 1.5-2.2 1.3-1.8 3.5-2.7 5.7-2 3.2 1 4.5 4.4 2.8 7.6-2.5 4.7-10 9.3-10 9.3z"/></svg>`,
    lock: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
    trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/><path d="M6 7l1 13a2 2 0 0 0 2 1.9h6a2 2 0 0 0 2-1.9l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
    envelope: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>`,
    back: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>`,
  };

  function iconEl(svgString, cls){
    const span = el('span', cls ? {class: cls} : {});
    span.innerHTML = svgString;
    return span;
  }

  function fmtWordCount(text){
    const n = (text || '').trim().split(/\s+/).filter(Boolean).length;
    return n + (n === 1 ? ' word' : ' words');
  }

  function fmtDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  }

  function currentAuthorName(){
    if(!state.user) return null;
    if(state.profile && state.profile.username) return state.profile.username;
    return state.user.email ? state.user.email.split('@')[0] : 'anonymous';
  }

  function objToSortedArray(obj){
    if(!obj) return [];
    return Object.keys(obj).map(id => ({ id, ...obj[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  function objToSortedArrayAsc(obj){
    if(!obj) return [];
    return Object.keys(obj).map(id => ({ id, ...obj[id] })).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  }

  function convoIdFor(a, b){
    return [a, b].sort().join('_');
  }

  function isFollowing(uid){
    return !!(state.myFollowing && state.myFollowing[uid]);
  }

  function unreadConversationCount(){
    if(!state.user) return 0;
    return state.conversations.filter(c =>
      c.lastFrom && c.lastFrom !== state.user.uid && (!c.lastReadAt || c.lastAt > c.lastReadAt)
    ).length;
  }

  function requireLogin(message){
    state.modal = 'auth';
    state.authMode = 'login';
    state.authError = message;
    render();
  }

  function followUser(targetUid){
    if(!state.user){ requireLogin('Log in to follow people.'); return; }
    const updates = {};
    updates['follows/' + state.user.uid + '/' + targetUid] = true;
    updates['followers/' + targetUid + '/' + state.user.uid] = true;
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not follow: ' + err.message;
      render();
    });
  }

  function unfollowUser(targetUid){
    if(!state.user) return;
    const updates = {};
    updates['follows/' + state.user.uid + '/' + targetUid] = null;
    updates['followers/' + targetUid + '/' + state.user.uid] = null;
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not unfollow: ' + err.message;
      render();
    });
  }

  const profileCache = {}; // uid -> username | null, memoized across openNetworkModal calls

  function openNetworkModal(tab){
    if(!state.user){ requireLogin('Log in to see your network.'); return; }
    state.modal = 'network';
    state.networkTab = tab || 'following';
    state.networkLoading = true;
    render();
    loadNetworkLists();
  }

  async function loadNetworkLists(){
    const followingUids = Object.keys(state.myFollowing || {});
    const followerUids = Object.keys(state.myFollowers || {});
    const uidsToFetch = [...new Set([...followingUids, ...followerUids])].filter(uid => !(uid in profileCache));
    try{
      const fetched = await Promise.all(uidsToFetch.map(uid =>
        db.ref('profiles/' + uid).once('value').then(snap => ({ uid, username: (snap.val() && snap.val().username) || null }))
      ));
      fetched.forEach(f => { profileCache[f.uid] = f.username; });
    } catch(err){
      state.banner = 'Could not load some profiles: ' + err.message;
    }
    state.networkFollowing = followingUids.map(uid => ({ uid, username: profileCache[uid] }));
    state.networkFollowers = followerUids.map(uid => ({ uid, username: profileCache[uid] }));
    state.networkLoading = false;
    render();
  }

  function markConversationRead(otherUid){
    if(!state.user) return;
    db.ref('userConversations/' + state.user.uid + '/' + otherUid + '/lastReadAt')
      .set(firebase.database.ServerValue.TIMESTAMP)
      .catch(() => {});
  }

  function openConversation(otherUid, otherUsername){
    if(!state.user){ requireLogin('Log in to send messages.'); return; }
    if(listenersAttached.thread && listenersAttached.thread !== otherUid){
      db.ref('messages/' + convoIdFor(state.user.uid, listenersAttached.thread)).off();
      listenersAttached.thread = null;
    }
    state.activeConversationUid = otherUid;
    state.activeConversationUsername = otherUsername || otherUid;
    state.messageDraft = '';
    state.modal = 'messages';
    markConversationRead(otherUid);
    if(!listenersAttached.thread){
      listenersAttached.thread = otherUid;
      db.ref('messages/' + convoIdFor(state.user.uid, otherUid)).on('value', snap => {
        state.activeMessages = objToSortedArrayAsc(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load messages: ' + err.message;
        render();
      });
    }
    render();
  }

  function closeConversation(){
    if(listenersAttached.thread){
      db.ref('messages/' + convoIdFor(state.user.uid, listenersAttached.thread)).off();
      listenersAttached.thread = null;
    }
    state.activeConversationUid = null;
    state.activeConversationUsername = null;
    state.activeMessages = [];
    state.messageDraft = '';
    render();
  }

  function sendMessage(){
    const text = (state.messageDraft || '').trim();
    if(!text || !state.user || !state.activeConversationUid) return;
    const myUid = state.user.uid;
    const otherUid = state.activeConversationUid;
    const cid = convoIdFor(myUid, otherUid);
    const msgKey = db.ref('messages/' + cid).push().key;
    const myName = currentAuthorName();
    const updates = {};
    updates['messages/' + cid + '/' + msgKey] = {
      from: myUid, to: otherUid, text,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    };
    updates['userConversations/' + myUid + '/' + otherUid] = {
      lastMessage: text, lastAt: firebase.database.ServerValue.TIMESTAMP,
      lastFrom: myUid, username: state.activeConversationUsername,
    };
    updates['userConversations/' + otherUid + '/' + myUid] = {
      lastMessage: text, lastAt: firebase.database.ServerValue.TIMESTAMP,
      lastFrom: myUid, username: myName,
    };
    state.messageDraft = '';
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not send message: ' + err.message;
      render();
    });
  }

  // ---------- auth state ----------
  auth.onAuthStateChanged(user => {
    const previousUid = state.user ? state.user.uid : null;
    state.user = user;
    state.authReady = true;

    // attach/detach the private-essays listener for this user
    if(listenersAttached.privateEssays && listenersAttached.privateEssays !== (user ? user.uid : null)){
      db.ref('privateEssays/' + listenersAttached.privateEssays).off();
      listenersAttached.privateEssays = null;
      state.privateEssays = [];
    }
    if(user && !listenersAttached.privateEssays){
      listenersAttached.privateEssays = user.uid;
      db.ref('privateEssays/' + user.uid).on('value', snap => {
        state.privateEssays = objToSortedArray(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load private entries: ' + err.message;
        render();
      });
    }

    // attach/detach the profile (username) listener for this user
    if(listenersAttached.profile && listenersAttached.profile !== (user ? user.uid : null)){
      db.ref('profiles/' + listenersAttached.profile).off();
      listenersAttached.profile = null;
      state.profile = null;
    }
    if(user && !listenersAttached.profile){
      listenersAttached.profile = user.uid;
      db.ref('profiles/' + user.uid).on('value', snap => {
        state.profile = snap.val();
        render();
      }, err => {
        state.banner = 'Could not load profile: ' + err.message;
        render();
      });
    }

    // attach/detach the follows listener for this user
    if(listenersAttached.follows && listenersAttached.follows !== (user ? user.uid : null)){
      db.ref('follows/' + listenersAttached.follows).off();
      listenersAttached.follows = null;
      state.myFollowing = {};
    }
    if(user && !listenersAttached.follows){
      listenersAttached.follows = user.uid;
      db.ref('follows/' + user.uid).on('value', snap => {
        state.myFollowing = snap.val() || {};
        render();
      }, err => {
        state.banner = 'Could not load follows: ' + err.message;
        render();
      });
    }

    // attach/detach the followers-list listener for this user (who follows me)
    if(listenersAttached.followersList && listenersAttached.followersList !== (user ? user.uid : null)){
      db.ref('followers/' + listenersAttached.followersList).off();
      listenersAttached.followersList = null;
      state.myFollowers = {};
    }
    if(user && !listenersAttached.followersList){
      listenersAttached.followersList = user.uid;
      db.ref('followers/' + user.uid).on('value', snap => {
        state.myFollowers = snap.val() || {};
        render();
      }, err => {
        state.banner = 'Could not load followers: ' + err.message;
        render();
      });
    }

    // attach/detach the conversation-index listener for this user
    if(listenersAttached.conversations && listenersAttached.conversations !== (user ? user.uid : null)){
      db.ref('userConversations/' + listenersAttached.conversations).off();
      listenersAttached.conversations = null;
      state.conversations = [];
      convosInitialized = false;
      lastKnownConvoAt = {};
    }
    if(user && !listenersAttached.conversations){
      listenersAttached.conversations = user.uid;
      db.ref('userConversations/' + user.uid).on('value', snap => {
        const obj = snap.val() || {};
        const list = Object.keys(obj).map(uid => ({ uid, ...obj[uid] }))
          .sort((a,b) => (b.lastAt||0) - (a.lastAt||0));

        if(!convosInitialized){
          // first load after login: just record where things stand, don't notify for old messages
          list.forEach(c => { lastKnownConvoAt[c.uid] = c.lastAt || 0; });
          convosInitialized = true;
        } else {
          list.forEach(c => {
            const prev = lastKnownConvoAt.hasOwnProperty(c.uid) ? lastKnownConvoAt[c.uid] : 0;
            const isIncoming = c.lastFrom && c.lastFrom !== user.uid;
            const isNew = c.lastAt && c.lastAt > prev;
            const alreadyViewingThisThread = state.modal === 'messages' && state.activeConversationUid === c.uid;
            if(isIncoming && isNew){
              if(alreadyViewingThisThread){
                markConversationRead(c.uid); // seeing it live counts as read
              } else {
                state.banner = '✉️ New message from @' + (c.username || 'someone') + ' — ' + (c.lastMessage || '').slice(0, 60);
              }
            }
            lastKnownConvoAt[c.uid] = c.lastAt || 0;
          });
        }

        state.conversations = list;
        render();
      }, err => {
        state.banner = 'Could not load conversations: ' + err.message;
        render();
      });
    }
    if(!user && listenersAttached.thread && previousUid){
      db.ref('messages/' + convoIdFor(previousUid, listenersAttached.thread)).off();
      listenersAttached.thread = null;
      state.activeMessages = [];
      state.activeConversationUid = null;
    }
    render();
  });

  if(!listenersAttached.publicEssays){
    listenersAttached.publicEssays = true;
    db.ref('publicEssays').on('value', snap => {
      state.publicEssays = objToSortedArray(snap.val());
      render();
    }, err => {
      state.banner = 'Could not load essays: ' + err.message;
      render();
    });
  }
  if(!listenersAttached.posts){
    listenersAttached.posts = true;
    db.ref('posts').on('value', snap => {
      state.posts = objToSortedArray(snap.val());
      render();
    }, err => {
      state.banner = 'Could not load posts: ' + err.message;
      render();
    });
  }

  // ---------- render ----------
  let currentPageKey = null;

  function appendOpenModal(app){
    if(state.modal === 'compose') app.appendChild(ComposeModal());
    if(state.modal === 'auth') app.appendChild(AuthModal());
    if(state.modal === 'settings') app.appendChild(SettingsModal());
    if(state.modal === 'people') app.appendChild(PeopleModal());
    if(state.modal === 'network') app.appendChild(NetworkModal());
    if(state.modal === 'messages') app.appendChild(MessagesModal());
  }

  function render(){
    const app = document.getElementById('app');

    if(state.page && state.page.type === 'edit'){
      // Freeze rebuilds only here — protects an in-progress contenteditable draft
      // from being wiped out by an unrelated background update elsewhere in the app.
      const key = 'edit:' + (state.page.essay ? state.page.essay.id : 'new');
      if(currentPageKey !== key){
        currentPageKey = key;
        app.innerHTML = '';
        app.appendChild(EssayPage());
      }
      return;
    }

    if(state.page && state.page.type === 'view'){
      // Reading has no uncommitted input to protect, so rebuild freely — this is what
      // lets Follow/Message/likes actually reflect live while looking at an essay.
      currentPageKey = null;
      app.innerHTML = '';
      app.appendChild(EssayPage());
      appendOpenModal(app);
      return;
    }
    currentPageKey = null;

    const scrollY = window.scrollY;
    app.innerHTML = '';
    app.appendChild(Header());
    app.appendChild(el('div', {class:'rule'}));
    app.appendChild(StatusLine());
    if(!state.authReady){
      app.appendChild(el('div', {class:'empty-note', style:'padding:60px 0;'}, 'connecting to archive…'));
    } else {
      app.appendChild(Main());
    }
    appendOpenModal(app);
    window.scrollTo(0, scrollY);
  }

  function Header(){
    const unread = unreadConversationCount();
    const messagesBtn = el('button', {class:'icon-btn', title:'Messages', onClick: onMessagesClick}, iconEl(ICONS.envelope));
    if(unread > 0){
      messagesBtn.appendChild(el('span', {class:'icon-badge'}, unread > 9 ? '9+' : String(unread)));
    }
    return el('header', {},
      el('div', {class:'wordmark'}, 'MARCHIVES'),
      el('div', {class:'header-right'},
        el('button', {class:'icon-btn', title:'Find people', onClick: onPeopleClick}, iconEl(ICONS.search)),
        messagesBtn,
        state.user
          ? el('button', {class:'text-link', onClick: onAccountClick}, (state.profile && state.profile.username) ? '@' + state.profile.username : 'SET USERNAME')
          : el('button', {class:'text-link', onClick: onLoginClick}, 'LOG IN'),
        el('button', {class:'pill-btn', onClick: onPostClick}, 'POST'),
      )
    );
  }

  function onPeopleClick(){
    state.modal = 'people';
    render();
  }

  function onMessagesClick(){
    if(!state.user){ requireLogin('Log in to view messages.'); return; }
    state.activeConversationUid = null;
    state.modal = 'messages';
    render();
  }

  function onAccountClick(){
    state.modal = 'settings';
    state.authError = null;
    render();
  }

  function onLoginClick(){
    state.modal = 'auth';
    state.authMode = 'login';
    state.authError = null;
    render();
  }

  function onPostClick(){
    if(!state.user){
      state.modal = 'auth';
      state.authMode = 'login';
      state.authError = 'Log in to post an entry.';
      render();
      return;
    }
    state.modal = 'compose';
    state.composeTab = 'essay';
    render();
  }

  function StatusLine(){
    const wrap = el('div', {class:'status-line'});
    if(state.banner){
      wrap.appendChild(document.createTextNode(state.banner + ' '));
      wrap.appendChild(el('button', {onClick: () => { state.banner = null; render(); }}, 'dismiss'));
    } else if(state.user){
      const handle = (state.profile && state.profile.username) ? '@' + state.profile.username : state.user.email;
      wrap.appendChild(document.createTextNode('signed in as ' + handle));
    } else {
      wrap.appendChild(document.createTextNode('viewing as guest — private entries hidden'));
    }
    return wrap;
  }

  function Main(){
    return el('main', {},
      Column('essays'),
      el('div', {class:'divider'}),
      Column('social'),
    );
  }

  function Column(kind){
    if(kind === 'essays'){
      const col = el('div', {class:'col'}, el('div', {class:'col-heading'}, 'ESSAYS'));
      const combined = [
        ...state.privateEssays.map(e => ({...e, private:true})),
        ...state.publicEssays.map(e => ({...e, private:false})),
      ].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

      if(combined.length === 0){
        col.appendChild(el('div', {class:'empty-note'}, 'Nothing written yet.', el('br'), 'Press POST to start an entry.'));
        return col;
      }
      combined.forEach(essay => col.appendChild(EssayItem(essay)));
      return col;
    } else {
      const col = el('div', {class:'col'}, el('div', {class:'col-heading'}, 'SOCIAL MEDIA POST'));
      if(state.posts.length === 0){
        col.appendChild(el('div', {class:'empty-note'}, 'No posts yet.', el('br'), 'Press POST to share something nerdy.'));
        return col;
      }
      state.posts.forEach(post => col.appendChild(PostCard(post)));
      return col;
    }
  }

  function AuthorLine(authorName, ownerUid){
    const wrap = el('span', {});
    wrap.appendChild(document.createTextNode('by ' + (authorName ? '@' + authorName : 'unknown')));
    if(state.user && ownerUid && ownerUid !== state.user.uid){
      const following = isFollowing(ownerUid);
      wrap.appendChild(document.createTextNode(' · '));
      wrap.appendChild(el('button', {class:'inline-link', onClick: () => following ? unfollowUser(ownerUid) : followUser(ownerUid)}, following ? 'Following' : 'Follow'));
      wrap.appendChild(document.createTextNode(' · '));
      wrap.appendChild(el('button', {class:'inline-link', onClick: () => openConversation(ownerUid, authorName)}, 'Message'));
    }
    return wrap;
  }

  function EssayItem(essay){
    const isOwner = state.user && essay.ownerUid === state.user.uid;
    const item = el('div', {class: 'essay-item'});
    const head = el('div', {class:'essay-head', onClick: () => openEssayView(essay)},
      el('span', {class:'essay-title underline'}, essay.title),
      el('span', {class: 'stamp ' + (essay.private ? 'private' : 'public')}, essay.private ? 'PRIVATE' : 'PUBLIC'),
    );
    if(isOwner){
      head.appendChild(el('button', {
        class:'delete-btn', style:'align-self:center;', title:'Delete entry',
        onClick: (e) => { e.stopPropagation(); deleteEssay(essay); }
      }, iconEl(ICONS.trash)));
    }
    item.appendChild(head);
    const meta = el('div', {class:'essay-meta', style:'margin-top:4px; cursor:pointer;', onClick: () => openEssayView(essay)});
    meta.appendChild(AuthorLine(essay.authorName, essay.ownerUid));
    meta.appendChild(document.createTextNode(' · ' + fmtDate(essay.createdAt)));
    item.appendChild(meta);
    return item;
  }

  function deleteEssay(essay){
    if(!confirm('Delete "' + essay.title + '"? This can\'t be undone.')) return;
    const path = essay.private ? 'privateEssays/' + essay.ownerUid + '/' + essay.id : 'publicEssays/' + essay.id;
    db.ref(path).remove().catch(err => {
      state.banner = 'Could not delete: ' + err.message;
      render();
    });
    if(state.page && state.page.essay && state.page.essay.id === essay.id) closeEssayPage();
  }

  // ---------- full-page essay document (editor + reader) ----------

  function openEssayView(essay){
    state.modal = null;
    state.page = { type: 'view', essay };
    render();
  }

  function openEssayEdit(essay){
    state.modal = null;
    state.page = { type: 'edit', essay: essay || null };
    render();
  }

  function closeEssayPage(){
    state.page = null;
    render();
  }

  // Minimal HTML sanitizer: strips anything outside a small safelist before
  // essay bodies (which are stored as raw editor HTML) are ever injected via innerHTML.
  function sanitizeEssayHtml(html){
    const allowed = new Set(['B','STRONG','I','EM','U','H2','H3','P','BR','UL','OL','LI','A','BLOCKQUOTE','DIV','SPAN']);
    let doc;
    try{ doc = new DOMParser().parseFromString(html || '', 'text/html'); }
    catch(e){ return ''; }
    function clean(node){
      [...node.childNodes].forEach(child => {
        if(child.nodeType === 1){
          if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM'].includes(child.tagName)){
            child.remove();
            return;
          }
          if(!allowed.has(child.tagName)){
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          [...child.attributes].forEach(attr => {
            if(child.tagName === 'A' && attr.name === 'href' && /^https?:\/\//i.test(attr.value)) return;
            child.removeAttribute(attr.name);
          });
          clean(child);
        } else if(child.nodeType === 8){
          child.remove();
        }
      });
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  function plainTextFromHtml(html){
    const div = document.createElement('div');
    div.innerHTML = sanitizeEssayHtml(html);
    return div.textContent || '';
  }

  // Find an essay (visible to the current viewer) that links to a given post — for the
  // reverse "this post illustrates an essay" indicator shown on PostCard.
  function findEssayLinkedToPost(postId){
    const pool = [...state.publicEssays, ...(state.user ? state.privateEssays.map(e => ({...e, private:true})) : [])];
    return pool.find(e => e.linkedPostId === postId) || null;
  }

  function saveEssayDoc(existingEssay, { title, bodyHtml, bibliography, linkedPostId, isPrivate, bodyFont }){
    const uid = state.user.uid;
    const payload = {
      title, bodyHtml,
      bibliography: bibliography || [],
      linkedPostId: linkedPostId || null,
      bodyFont: bodyFont || 'lora',
      ownerUid: uid,
      authorName: currentAuthorName(),
      createdAt: existingEssay ? existingEssay.createdAt : firebase.database.ServerValue.TIMESTAMP,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
    };
    if(!existingEssay){
      const path = isPrivate ? 'privateEssays/' + uid : 'publicEssays';
      const key = db.ref(path).push().key;
      return db.ref(path + '/' + key).set(payload).then(() => ({ ...payload, id: key, private: isPrivate }));
    }
    const wasPrivate = !!existingEssay.private;
    const oldPath = wasPrivate ? 'privateEssays/' + existingEssay.ownerUid + '/' + existingEssay.id : 'publicEssays/' + existingEssay.id;
    if(wasPrivate === isPrivate){
      return db.ref(oldPath).update(payload).then(() => ({ ...existingEssay, ...payload, private: isPrivate }));
    }
    const newPath = isPrivate ? 'privateEssays/' + uid + '/' + existingEssay.id : 'publicEssays/' + existingEssay.id;
    const updates = {};
    updates[oldPath] = null;
    updates[newPath] = payload;
    return db.ref().update(updates).then(() => ({ ...existingEssay, ...payload, private: isPrivate }));
  }

  function EssayPage(){
    if(state.page.type === 'edit') return EssayEditor(state.page.essay);
    return EssayReader(state.page.essay);
  }

  function EssayEditor(existingEssay){
    const page = el('div', {class:'doc-page'});
    let isPrivate = existingEssay ? !!existingEssay.private : false;
    let linkedPostId = existingEssay ? (existingEssay.linkedPostId || null) : null;
    let bibliography = existingEssay && existingEssay.bibliography ? existingEssay.bibliography.map(b => ({...b})) : [];
    let bodyFont = existingEssay && existingEssay.bodyFont ? existingEssay.bodyFont : 'lora';
    let saving = false;

    // top bar
    const topbar = el('div', {class:'doc-topbar'});
    const left = el('div', {class:'doc-topbar-left'});
    left.appendChild(el('button', {class:'icon-btn', title:'Back', onClick: () => {
      if(confirm('Discard this draft and go back?')) closeEssayPage();
    }}, iconEl(ICONS.back)));

    const privacyRow = el('div', {style:'display:flex; align-items:center; gap:8px;'});
    privacyRow.appendChild(el('span', {class:'essay-meta'}, 'PRIVATE'));
    const switchEl = el('div', {class:'switch' + (isPrivate ? ' is-private' : '')});
    switchEl.appendChild(el('div', {class:'knob'}));
    switchEl.addEventListener('click', () => {
      isPrivate = !isPrivate;
      switchEl.classList.toggle('is-private', isPrivate);
    });
    privacyRow.appendChild(switchEl);
    left.appendChild(privacyRow);
    topbar.appendChild(left);

    const saveBtn = el('button', {class:'pill-btn', onClick: onSave}, existingEssay ? 'Save changes' : 'Publish');
    topbar.appendChild(saveBtn);
    page.appendChild(topbar);

    // formatting toolbar
    const toolbar = el('div', {class:'doc-toolbar'});
    function toolBtn(label, cmd, arg){
      return el('button', {
        class:'doc-tool-btn', type:'button',
        onMousedown: (e) => e.preventDefault(), // keep focus/selection in the editable area
        onClick: () => { bodyEl.focus(); document.execCommand(cmd, false, arg || null); },
      }, label);
    }
    toolbar.appendChild(toolBtn('B', 'bold'));
    toolbar.appendChild(toolBtn('I', 'italic'));
    toolbar.appendChild(toolBtn('U', 'underline'));
    toolbar.appendChild(toolBtn('H2', 'formatBlock', 'H2'));
    toolbar.appendChild(toolBtn('H3', 'formatBlock', 'H3'));
    toolbar.appendChild(toolBtn('“ ”', 'formatBlock', 'BLOCKQUOTE'));
    toolbar.appendChild(toolBtn('• List', 'insertUnorderedList'));
    toolbar.appendChild(toolBtn('1. List', 'insertOrderedList'));
    toolbar.appendChild(el('button', {
      class:'doc-tool-btn', type:'button',
      onMousedown: (e) => e.preventDefault(),
      onClick: () => {
        const url = prompt('Link URL (https://…)');
        if(url && /^https?:\/\//i.test(url)){ bodyEl.focus(); document.execCommand('createLink', false, url); }
      },
    }, 'Link'));
    toolbar.appendChild(toolBtn('Clear', 'removeFormat'));

    const fontSelect = el('select', {class:'doc-tool-btn', title:'Body font'});
    FONT_OPTIONS.forEach(f => {
      const opt = el('option', {value: f.id}, f.label);
      opt.style.fontFamily = f.family;
      if(f.id === bodyFont) opt.selected = true;
      fontSelect.appendChild(opt);
    });
    fontSelect.addEventListener('change', () => {
      bodyFont = fontSelect.value;
      bodyEl.style.fontFamily = fontFamilyFor(bodyFont);
    });
    toolbar.appendChild(fontSelect);
    page.appendChild(toolbar);

    // body
    const wrap = el('div', {class:'doc-body-wrap'});
    const titleInput = el('input', {
      class:'doc-title-input', type:'text', placeholder:'Untitled essay',
      value: existingEssay ? existingEssay.title : '',
    });
    wrap.appendChild(titleInput);

    const bodyEl = el('div', {
      class:'doc-editable', contenteditable:'true', 'data-placeholder':'Start writing…',
      style: 'font-family: ' + fontFamilyFor(bodyFont) + ';',
    });
    if(existingEssay){
      bodyEl.innerHTML = existingEssay.bodyHtml
        ? sanitizeEssayHtml(existingEssay.bodyHtml)
        : '<p>' + (existingEssay.body || '').replace(/</g, '&lt;') + '</p>';
    }
    wrap.appendChild(bodyEl);

    // bibliography
    wrap.appendChild(el('div', {class:'doc-section-heading'}, 'REFERENCES'));
    const bibList = el('div', {});
    function renderBibRows(){
      bibList.innerHTML = '';
      bibliography.forEach((ref, i) => {
        const row = el('div', {class:'doc-bib-row'});
        const labelInput = el('input', {type:'text', placeholder:'Title / author', value: ref.label || ''});
        const urlInput = el('input', {type:'url', placeholder:'https:// (optional)', value: ref.url || ''});
        labelInput.addEventListener('input', (e) => { bibliography[i].label = e.target.value; });
        urlInput.addEventListener('input', (e) => { bibliography[i].url = e.target.value; });
        const removeBtn = el('button', {class:'delete-btn', style:'margin-left:0;', title:'Remove', onClick: () => {
          bibliography.splice(i, 1);
          renderBibRows();
        }}, iconEl(ICONS.trash));
        row.appendChild(labelInput);
        row.appendChild(urlInput);
        row.appendChild(removeBtn);
        bibList.appendChild(row);
      });
    }
    renderBibRows();
    wrap.appendChild(bibList);
    wrap.appendChild(el('button', {class:'inline-link', style:'margin-top:4px;', onClick: () => {
      bibliography.push({ label:'', url:'' });
      renderBibRows();
    }}, '+ Add reference'));

    // link to a social post
    wrap.appendChild(el('div', {class:'doc-section-heading'}, 'LINK A SOCIAL POST — the aesthetic depiction of this essay'));
    const myPosts = state.posts.filter(p => state.user && p.ownerUid === state.user.uid);
    const picker = el('div', {class:'doc-post-picker'});
    function renderPicker(){
      picker.innerHTML = '';
      const none = el('div', {class:'doc-none-tile' + (!linkedPostId ? ' selected' : ''), onClick: () => { linkedPostId = null; renderPicker(); }}, 'None');
      picker.appendChild(none);
      myPosts.forEach(p => {
        const tile = el('div', {class:'doc-post-tile' + (linkedPostId === p.id ? ' selected' : ''), onClick: () => { linkedPostId = p.id; renderPicker(); }});
        if(p.image) tile.appendChild(el('img', {src:p.image, alt:'post'}));
        tile.appendChild(el('div', {class:'doc-post-tile-caption'}, p.caption || ''));
        picker.appendChild(tile);
      });
      if(myPosts.length === 0){
        picker.appendChild(el('div', {class:'essay-meta'}, 'You don\'t have any social posts yet.'));
      }
    }
    renderPicker();
    wrap.appendChild(picker);

    page.appendChild(wrap);

    function onSave(){
      const title = titleInput.value.trim();
      const bodyHtml = sanitizeEssayHtml(bodyEl.innerHTML);
      const bodyText = plainTextFromHtml(bodyHtml);
      if(!title || !bodyText.trim()){
        alert('Please add a title and some body text before publishing.');
        return;
      }
      if(saving) return;
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const cleanBib = bibliography.filter(r => (r.label && r.label.trim()) || (r.url && r.url.trim()));
      saveEssayDoc(existingEssay, { title, bodyHtml, bibliography: cleanBib, linkedPostId, isPrivate, bodyFont })
        .then(saved => { openEssayView(saved); })
        .catch(err => {
          saving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = existingEssay ? 'Save changes' : 'Publish';
          alert('Could not save: ' + err.message);
        });
    }

    return page;
  }

  function EssayReader(essay){
    const page = el('div', {class:'doc-page'});
    const isOwner = state.user && essay.ownerUid === state.user.uid;

    const topbar = el('div', {class:'doc-topbar'});
    topbar.appendChild(el('button', {class:'icon-btn', title:'Back', onClick: closeEssayPage}, iconEl(ICONS.back)));
    const rightBtns = el('div', {style:'display:flex; gap:14px; align-items:center;'});
    if(isOwner){
      rightBtns.appendChild(el('button', {class:'text-link', onClick: () => openEssayEdit(essay)}, 'Edit'));
      rightBtns.appendChild(el('button', {class:'delete-btn', title:'Delete', onClick: () => deleteEssay(essay)}, iconEl(ICONS.trash)));
    }
    topbar.appendChild(rightBtns);
    page.appendChild(topbar);

    const wrap = el('div', {class:'doc-body-wrap'});
    wrap.appendChild(el('div', {class:'stamp ' + (essay.private ? 'private' : 'public'), style:'margin-bottom:14px;'}, essay.private ? 'PRIVATE' : 'PUBLIC'));
    wrap.appendChild(el('div', {class:'doc-title-display'}, essay.title));
    const meta = el('div', {class:'essay-meta', style:'margin-bottom:30px;'});
    meta.appendChild(AuthorLine(essay.authorName, essay.ownerUid));
    meta.appendChild(document.createTextNode(' · ' + fmtDate(essay.createdAt)));
    wrap.appendChild(meta);

    const bodyHtml = essay.bodyHtml
      ? sanitizeEssayHtml(essay.bodyHtml)
      : '<p>' + (essay.body || '').replace(/</g, '&lt;') + '</p>';
    const bodyEl = el('div', {class:'doc-read-body', style:'font-family: ' + fontFamilyFor(essay.bodyFont) + ';'});
    bodyEl.innerHTML = bodyHtml;
    wrap.appendChild(bodyEl);

    if(essay.bibliography && essay.bibliography.length > 0){
      wrap.appendChild(el('div', {class:'doc-section-heading'}, 'REFERENCES'));
      const list = el('ol', {class:'doc-bib-list'});
      essay.bibliography.forEach(ref => {
        const li = el('li', {});
        if(ref.url && /^https?:\/\//i.test(ref.url)){
          li.appendChild(el('a', {href: ref.url, target:'_blank', rel:'noopener noreferrer'}, ref.label || ref.url));
        } else {
          li.appendChild(document.createTextNode(ref.label || ref.url || ''));
        }
        list.appendChild(li);
      });
      wrap.appendChild(list);
    }

    const linkedPost = essay.linkedPostId ? state.posts.find(p => p.id === essay.linkedPostId) : null;
    if(linkedPost){
      wrap.appendChild(el('div', {class:'doc-section-heading'}, 'AESTHETIC DEPICTION'));
      const card = el('div', {class:'doc-embedded-post', onClick: () => { closeEssayPage(); }});
      if(linkedPost.image) card.appendChild(el('img', {src: linkedPost.image, alt:'linked post'}));
      card.appendChild(el('div', {class:'post-caption'}, linkedPost.caption));
      card.appendChild(el('div', {class:'essay-meta', style:'margin-top:8px;'}, 'From the social feed · tap to view'));
      wrap.appendChild(card);
    }

    page.appendChild(wrap);
    return page;
  }

  function PostCard(post){
    const card = el('div', {class:'post-card'});
    if(post.image){
      const imgWrap = el('div', {class:'post-img-wrap'});
      const img = el('img', {src: post.image, alt: 'post image'});
      img.onerror = () => { imgWrap.style.display = 'none'; };
      imgWrap.appendChild(img);
      card.appendChild(imgWrap);
    }
    const likedByMe = !!(post.likes && state.user && post.likes[state.user.uid]);
    const likeCount = post.likes ? Object.keys(post.likes).length : 0;
    const isOwner = state.user && post.ownerUid === state.user.uid;
    const actions = el('div', {class:'post-actions'},
      el('button', {class:'heart-btn', onClick: () => toggleLike(post)}, iconEl(ICONS.heart(likedByMe))),
      el('span', {class:'like-count'}, likeCount > 0 ? String(likeCount) : ''),
    );
    if(isOwner){
      actions.appendChild(el('button', {
        class:'delete-btn', title:'Delete post',
        onClick: () => deletePost(post)
      }, iconEl(ICONS.trash)));
    }
    card.appendChild(actions);
    card.appendChild(el('div', {class:'post-caption'}, post.caption));
    const timeRow = el('div', {class:'post-time'});
    timeRow.appendChild(AuthorLine(post.authorName, post.ownerUid));
    timeRow.appendChild(document.createTextNode(' · ' + fmtDate(post.createdAt)));
    card.appendChild(timeRow);

    const linkedEssay = findEssayLinkedToPost(post.id);
    if(linkedEssay){
      card.appendChild(el('div', {class:'post-time', style:'margin-top:4px;'},
        '📖 ',
        el('button', {class:'inline-link', onClick: () => openEssayView(linkedEssay)}, 'Read the essay: ' + linkedEssay.title),
      ));
    }
    return card;
  }

  function deletePost(post){
    if(!confirm('Delete this post? This can\'t be undone.')) return;
    db.ref('posts/' + post.id).remove().then(() => {
      if(post.image && post.image.includes('firebasestorage')){
        storage.refFromURL(post.image).delete().catch(() => {});
      }
    }).catch(err => {
      state.banner = 'Could not delete: ' + err.message;
      render();
    });
  }

  function toggleLike(post){
    if(!state.user){
      state.modal = 'auth';
      state.authMode = 'login';
      state.authError = 'Log in to like a post.';
      render();
      return;
    }
    const ref = db.ref('posts/' + post.id + '/likes/' + state.user.uid);
    const currentlyLiked = !!(post.likes && post.likes[state.user.uid]);
    ref.set(currentlyLiked ? null : true).catch(err => {
      state.banner = 'Could not update like: ' + err.message;
      render();
    });
  }

  // ---------- auth modal ----------
  function AuthModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay && !state.authBusy) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, state.authMode === 'login' ? 'Log In' : 'Sign Up'));

    if(state.authError){
      modal.appendChild(el('div', {class:'field-error', style:'text-align:center; margin-bottom:10px;'}, state.authError));
    }

    const emailLabel = el('label', {class:'field-label'}, 'EMAIL');
    const emailInput = el('input', {type:'text', placeholder:'you@example.com'});
    const passLabel = el('label', {class:'field-label'}, 'PASSWORD');
    const passInput = el('input', {type:'password', placeholder:'••••••••'});

    modal.appendChild(emailLabel);
    modal.appendChild(emailInput);
    modal.appendChild(passLabel);
    modal.appendChild(passInput);

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel');
    const submitBtn = el('button', {class:'btn-primary', onClick: async () => {
      const email = emailInput.value.trim();
      const password = passInput.value;
      if(!email || !password){
        state.authError = 'Email and password are both required.';
        render();
        return;
      }
      state.authBusy = true;
      state.authError = null;
      render();
      try{
        if(state.authMode === 'login'){
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          await auth.createUserWithEmailAndPassword(email, password);
        }
        state.authBusy = false;
        closeModal();
      } catch(err){
        state.authBusy = false;
        state.authError = err.message;
        render();
      }
    }}, state.authBusy ? 'Please wait…' : (state.authMode === 'login' ? 'Log in' : 'Create account'));
    submitBtn.disabled = state.authBusy;
    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    modal.appendChild(actions);

    modal.appendChild(el('div', {class:'auth-toggle-text'},
      state.authMode === 'login' ? "Don't have an account? " : 'Already have an account? ',
      el('button', {onClick: () => {
        state.authMode = state.authMode === 'login' ? 'signup' : 'login';
        state.authError = null;
        render();
      }}, state.authMode === 'login' ? 'Sign up' : 'Log in'),
    ));

    overlay.appendChild(modal);
    return overlay;
  }

  // ---------- settings modal ----------
  function SettingsModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'Settings'));

    modal.appendChild(el('div', {class:'essay-meta', style:'text-align:center; margin-bottom:4px;'}, state.user.email));

    const networkRow = el('div', {style:'text-align:center; margin-bottom:20px;'});
    networkRow.appendChild(el('button', {class:'inline-link', onClick: () => openNetworkModal('following')},
      Object.keys(state.myFollowing || {}).length + ' following'
    ));
    networkRow.appendChild(document.createTextNode('  ·  '));
    networkRow.appendChild(el('button', {class:'inline-link', onClick: () => openNetworkModal('followers')},
      Object.keys(state.myFollowers || {}).length + ' followers'
    ));
    modal.appendChild(networkRow);

    let errorEl = null;
    let successEl = null;

    const usernameLabel = el('label', {class:'field-label'}, 'USERNAME');
    const usernameInput = el('input', {
      type:'text',
      placeholder:'lowercase, letters/numbers/underscore',
      value: (state.profile && state.profile.username) || '',
    });
    modal.appendChild(usernameLabel);
    modal.appendChild(usernameInput);
    modal.appendChild(el('div', {class:'essay-meta', style:'margin-top:6px;'}, '3–20 characters: letters, numbers, underscores.'));

    const saveActions = el('div', {class:'modal-actions'});
    const saveBtn = el('button', {class:'btn-primary', onClick: async () => {
      const raw = usernameInput.value.trim();
      const cleaned = raw.toLowerCase();
      if(errorEl){ errorEl.remove(); errorEl = null; }
      if(successEl){ successEl.remove(); successEl = null; }

      if(!/^[a-z0-9_]{3,20}$/.test(cleaned)){
        errorEl = el('div', {class:'field-error'}, 'Use 3–20 letters, numbers, or underscores.');
        modal.insertBefore(errorEl, saveActions);
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const oldUsername = state.profile && state.profile.username;
      try{
        const updates = {};
        updates['profiles/' + state.user.uid] = {
          username: cleaned,
          updatedAt: firebase.database.ServerValue.TIMESTAMP,
        };
        updates['usernameIndex/' + cleaned] = state.user.uid;
        if(oldUsername && oldUsername !== cleaned){
          updates['usernameIndex/' + oldUsername] = null;
        }
        await db.ref().update(updates);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save username';
        successEl = el('div', {class:'essay-meta', style:'color: var(--public); text-align:center; margin-top:10px;'}, 'Username saved.');
        modal.appendChild(successEl);
      } catch(err){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save username';
        errorEl = el('div', {class:'field-error'}, 'Could not save: ' + err.message);
        modal.insertBefore(errorEl, saveActions);
      }
    }}, 'Save username');
    saveActions.appendChild(saveBtn);
    modal.appendChild(saveActions);

    const logoutActions = el('div', {class:'modal-actions', style:'margin-top:8px;'});
    const closeBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Close');
    const logoutBtn = el('button', {class:'btn-secondary', style:'color: var(--private); border-color: var(--private);', onClick: () => {
      auth.signOut();
      closeModal();
    }}, 'Log out');
    logoutActions.appendChild(closeBtn);
    logoutActions.appendChild(logoutBtn);
    modal.appendChild(logoutActions);

    overlay.appendChild(modal);
    return overlay;
  }

  // ---------- people (find & follow) modal ----------
  function PeopleModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'Find People'));

    const searchRow = el('div', {style:'display:flex; gap:8px; align-items:flex-start;'});
    const queryInput = el('input', {type:'text', placeholder:'search username', style:'flex:1;'});
    const searchBtn = el('button', {class:'btn-primary', style:'flex:0 0 auto; padding:10px 16px;', onClick: doSearch}, 'Search');
    searchRow.appendChild(queryInput);
    searchRow.appendChild(searchBtn);
    modal.appendChild(searchRow);

    queryInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); doSearch(); } });

    const resultsWrap = el('div', {style:'margin-top:18px; max-height:320px; overflow-y:auto;'});
    modal.appendChild(resultsWrap);

    function renderResults(){
      resultsWrap.innerHTML = '';
      if(!state.peopleSearched){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'Search for a username to follow or message.'));
        return;
      }
      if(state.peopleResults.length === 0){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No one found.'));
        return;
      }
      state.peopleResults.forEach(person => {
        if(state.user && person.uid === state.user.uid) return;
        const row = el('div', {style:'display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline);'});
        row.appendChild(el('span', {}, '@' + person.username));
        const btnGroup = el('div', {style:'display:flex; gap:14px;'});
        const following = isFollowing(person.uid);
        btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => { following ? unfollowUser(person.uid) : followUser(person.uid); }}, following ? 'Following' : 'Follow'));
        btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => openConversation(person.uid, person.username)}, 'Message'));
        row.appendChild(btnGroup);
        resultsWrap.appendChild(row);
      });
      if(resultsWrap.children.length === 0){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No one found.'));
      }
    }

    async function doSearch(){
      const prefix = queryInput.value.trim().toLowerCase();
      if(!prefix) return;
      searchBtn.disabled = true;
      searchBtn.textContent = '…';
      try{
        const snap = await db.ref('usernameIndex')
          .orderByKey().startAt(prefix).endAt(prefix + '\uf8ff').limitToFirst(25).once('value');
        const obj = snap.val() || {};
        state.peopleResults = Object.keys(obj).map(username => ({ username, uid: obj[username] }));
        state.peopleSearched = true;
      } catch(err){
        state.banner = 'Search failed: ' + err.message;
      }
      searchBtn.disabled = false;
      searchBtn.textContent = 'Search';
      renderResults();
    }

    renderResults();

    const actions = el('div', {class:'modal-actions', style:'margin-top:18px;'});
    actions.appendChild(el('button', {class:'btn-secondary', onClick: closeModal}, 'Close'));
    modal.appendChild(actions);

    overlay.appendChild(modal);
    return overlay;
  }

  // ---------- network (following / followers) modal ----------
  function NetworkModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'Your Network'));

    const tabs = el('div', {class:'tab-row'},
      el('button', {class:'tab-btn' + (state.networkTab === 'following' ? ' active' : ''), onClick: () => { state.networkTab = 'following'; render(); }},
        'FOLLOWING (' + Object.keys(state.myFollowing || {}).length + ')'),
      el('button', {class:'tab-btn' + (state.networkTab === 'followers' ? ' active' : ''), onClick: () => { state.networkTab = 'followers'; render(); }},
        'FOLLOWERS (' + Object.keys(state.myFollowers || {}).length + ')'),
    );
    modal.appendChild(tabs);

    const listWrap = el('div', {style:'margin-top:16px; max-height:340px; overflow-y:auto;'});

    if(state.networkLoading){
      listWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'loading…'));
    } else {
      const list = state.networkTab === 'following' ? state.networkFollowing : state.networkFollowers;
      if(list.length === 0){
        listWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'},
          state.networkTab === 'following' ? "You aren't following anyone yet." : 'No one follows you yet.'
        ));
      } else {
        list.forEach(person => {
          const row = el('div', {style:'display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline);'});
          row.appendChild(el('span', {}, person.username ? '@' + person.username : person.uid.slice(0, 8) + '…'));
          const btnGroup = el('div', {style:'display:flex; gap:14px;'});
          const following = isFollowing(person.uid);
          btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => {
            if(following) unfollowUser(person.uid); else followUser(person.uid);
          }}, following ? 'Following' : 'Follow'));
          btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => openConversation(person.uid, person.username)}, 'Message'));
          row.appendChild(btnGroup);
          listWrap.appendChild(row);
        });
      }
    }
    modal.appendChild(listWrap);

    const actions = el('div', {class:'modal-actions', style:'margin-top:18px;'});
    actions.appendChild(el('button', {class:'btn-secondary', onClick: closeModal}, 'Close'));
    modal.appendChild(actions);

    overlay.appendChild(modal);
    return overlay;
  }

  // ---------- messages modal ----------
  function MessagesModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});

    if(!state.activeConversationUid){
      modal.appendChild(el('h2', {}, 'Messages'));
      const list = el('div', {style:'max-height:360px; overflow-y:auto;'});
      if(state.conversations.length === 0){
        list.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No conversations yet. Find someone and press Message.'));
      } else {
        state.conversations.forEach(convo => {
          const unread = convo.lastFrom && state.user && convo.lastFrom !== state.user.uid && (!convo.lastReadAt || convo.lastAt > convo.lastReadAt);
          const row = el('div', {
            style:'padding:12px 0; border-bottom:1px solid var(--hairline); cursor:pointer; display:flex; align-items:flex-start; gap:8px;',
            onClick: () => openConversation(convo.uid, convo.username),
          });
          if(unread) row.appendChild(el('span', {style:'width:8px; height:8px; border-radius:999px; background:var(--private); margin-top:6px; flex-shrink:0;'}));
          const textCol = el('div', {});
          textCol.appendChild(el('div', {style: unread ? 'font-weight:600;' : ''}, '@' + (convo.username || 'unknown')));
          textCol.appendChild(el('div', {class:'essay-meta', style:'margin-top:4px;'},
            (convo.lastMessage || '').slice(0, 60) + ((convo.lastMessage||'').length > 60 ? '…' : '') + ' · ' + fmtDate(convo.lastAt)
          ));
          row.appendChild(textCol);
          list.appendChild(row);
        });
      }
      modal.appendChild(list);
      const actions = el('div', {class:'modal-actions', style:'margin-top:18px;'});
      actions.appendChild(el('button', {class:'btn-secondary', onClick: closeModal}, 'Close'));
      modal.appendChild(actions);
    } else {
      const headRow = el('div', {style:'display:flex; align-items:center; gap:10px; margin-bottom:16px;'});
      headRow.appendChild(el('button', {class:'icon-btn', onClick: closeConversation}, iconEl(ICONS.back)));
      headRow.appendChild(el('h2', {style:'margin:0;'}, '@' + state.activeConversationUsername));
      modal.appendChild(headRow);

      const thread = el('div', {style:'max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 0;'});
      if(state.activeMessages.length === 0){
        thread.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No messages yet — say hello.'));
      } else {
        state.activeMessages.forEach(msg => {
          const mine = state.user && msg.from === state.user.uid;
          const bubble = el('div', {style:
            'max-width:78%; padding:8px 12px; font-size:14px; line-height:1.4; ' +
            'align-self:' + (mine ? 'flex-end' : 'flex-start') + '; ' +
            'background:' + (mine ? 'var(--ink)' : 'var(--paper)') + '; ' +
            'color:' + (mine ? 'var(--paper)' : 'var(--ink)') + '; ' +
            'border:1px solid var(--hairline);'
          }, msg.text);
          thread.appendChild(bubble);
        });
      }
      modal.appendChild(thread);

      const composeRow = el('div', {style:'display:flex; gap:8px; margin-top:14px;'});
      const draftInput = el('input', {type:'text', placeholder:'Type a message…', style:'flex:1;', value: state.messageDraft});
      draftInput.addEventListener('input', (e) => { state.messageDraft = e.target.value; });
      draftInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); } });
      const sendBtn = el('button', {class:'btn-primary', style:'flex:0 0 auto; padding:10px 16px;', onClick: sendMessage}, 'Send');
      composeRow.appendChild(draftInput);
      composeRow.appendChild(sendBtn);
      modal.appendChild(composeRow);

      const actions = el('div', {class:'modal-actions', style:'margin-top:14px;'});
      actions.appendChild(el('button', {class:'btn-secondary', onClick: () => { closeConversation(); closeModal(); }}, 'Close'));
      modal.appendChild(actions);

      setTimeout(() => { thread.scrollTop = thread.scrollHeight; }, 0);
    }

    overlay.appendChild(modal);
    return overlay;
  }

  function closeModal(){
    state.modal = null;
    state.authError = null;
    render();
  }

  // ---------- compose modal ----------
  function ComposeModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'New Entry'));

    const tabs = el('div', {class:'tab-row'},
      el('button', {class:'tab-btn' + (state.composeTab === 'essay' ? ' active' : ''), onClick: () => { state.composeTab = 'essay'; render(); }}, 'ESSAY'),
      el('button', {class:'tab-btn' + (state.composeTab === 'social' ? ' active' : ''), onClick: () => { state.composeTab = 'social'; render(); }}, 'SOCIAL POST'),
    );
    modal.appendChild(tabs);

    if(state.composeTab === 'essay') modal.appendChild(EssayForm());
    else modal.appendChild(SocialForm());

    overlay.appendChild(modal);
    return overlay;
  }

  function EssayForm(){
    const wrap = el('div', {});
    wrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center; margin-bottom:20px; line-height:1.7;'},
      'Essays now open in a full document editor — room to write, format, add references, and link a social post as its aesthetic depiction.'
    ));
    const actions = el('div', {class:'modal-actions'});
    actions.appendChild(el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel'));
    actions.appendChild(el('button', {class:'btn-primary', onClick: () => openEssayEdit(null)}, 'Start writing'));
    wrap.appendChild(actions);
    return wrap;
  }

  function SocialForm(){
    const form = el('div', {});
    let errorEl = null;
    let selectedFile = null;
    let previewUrl = null;

    const imgLabel = el('label', {class:'field-label'}, 'IMAGE');
    form.appendChild(imgLabel);

    const fileInput = el('input', {type:'file', accept:'image/*'});
    const pickerStatus = el('span', {class:'image-picker-status'}, 'No photo chosen');
    const pickerBtn = el('button', {type:'button', class:'image-picker-btn', onClick: (e) => { e.preventDefault(); fileInput.click(); }}, 'Choose Photo');
    const picker = el('div', {class:'image-picker'}, pickerBtn, pickerStatus, fileInput);
    form.appendChild(picker);

    const previewSlot = el('div', {});
    form.appendChild(previewSlot);

    function renderPreview(){
      previewSlot.innerHTML = '';
      if(!previewUrl) return;
      const wrap = el('div', {class:'image-preview-wrap'});
      wrap.appendChild(el('img', {src: previewUrl, alt:'selected photo'}));
      wrap.appendChild(el('button', {type:'button', class:'image-preview-remove', onClick: (e) => {
        e.preventDefault();
        selectedFile = null;
        previewUrl = null;
        fileInput.value = '';
        pickerStatus.textContent = 'No photo chosen';
        renderPreview();
      }}, '×'));
      previewSlot.appendChild(wrap);
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){
        pickerStatus.textContent = 'Please choose an image file';
        return;
      }
      if(file.size > 8 * 1024 * 1024){
        pickerStatus.textContent = 'Image too large (max 8MB)';
        return;
      }
      selectedFile = file;
      previewUrl = URL.createObjectURL(file);
      pickerStatus.textContent = file.name;
      renderPreview();
    });

    form.appendChild(el('div', {class:'or-divider'}, '— OR —'));
    const urlLabel = el('label', {class:'field-label'}, 'IMAGE URL');
    const imgInput = el('input', {type:'url', placeholder:'https://…'});
    form.appendChild(urlLabel);
    form.appendChild(imgInput);

    const capLabel = el('label', {class:'field-label'}, 'CAPTION');
    const capInput = el('textarea', {placeholder:'Say something nerdy…', style:'min-height:70px;'});
    form.appendChild(capLabel);
    form.appendChild(capInput);

    const progressWrap = el('div', {class:'upload-progress', style:'display:none;'});
    const progressBar = el('div', {class:'upload-progress-bar'});
    progressWrap.appendChild(progressBar);
    form.appendChild(progressWrap);

    const note = el('div', {class:'essay-meta', style:'margin-top:14px;'}, 'Social posts are always public — visible to anyone viewing the archive.');
    form.appendChild(note);

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel');
    const saveBtn = el('button', {class:'btn-primary', onClick: async () => {
      const caption = capInput.value.trim();
      if(!caption){
        if(!errorEl){
          errorEl = el('div', {class:'field-error'}, 'Caption is required.');
          form.appendChild(errorEl);
        }
        return;
      }
      saveBtn.disabled = true;
      cancelBtn.disabled = true;
      const uid = state.user.uid;

      try{
        let imageUrl = imgInput.value.trim();

        if(selectedFile){
          saveBtn.textContent = 'Uploading…';
          progressWrap.style.display = 'block';
          const path = 'posts/' + uid + '/' + Date.now() + '_' + selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const storageRef = storage.ref(path);
          const uploadTask = storageRef.put(selectedFile);
          imageUrl = await new Promise((resolve, reject) => {
            uploadTask.on('state_changed', snap => {
              const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
              progressBar.style.width = pct + '%';
            }, reject, async () => {
              try{ resolve(await uploadTask.snapshot.ref.getDownloadURL()); }
              catch(e){ reject(e); }
            });
          });
        }

        saveBtn.textContent = 'Posting…';
        const newRef = db.ref('posts').push();
        await newRef.set({
          image: imageUrl,
          caption,
          ownerUid: uid,
          authorName: currentAuthorName(),
          likes: {},
          createdAt: firebase.database.ServerValue.TIMESTAMP,
        });
        closeModal();
      } catch(err){
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = 'Share post';
        progressWrap.style.display = 'none';
        if(!errorEl){
          errorEl = el('div', {class:'field-error'});
          form.appendChild(errorEl);
        }
        errorEl.textContent = 'Could not post: ' + err.message;
      }
    }}, 'Share post');
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    form.appendChild(actions);

    return form;
  }

  render();
})();
</script>
</body>
</html>
