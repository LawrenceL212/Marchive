<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e7e4dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e7e4dc;
    --paper-raised: #edeae2;
    --ink: #1b1a17;
    --ink-soft: #3a382f;
    --muted: #78745f;
    --line: #1b1a17;
    --hairline: rgba(27,26,23,0.14);
    --private: #6b2b3a;
    --private-soft: #6b2b3a1a;
    --public: #45573f;
    --public-soft: #45573f1a;
    --paper-shadow: rgba(27,26,23,0.08);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.02) 0, transparent 40%);
  }

  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 28px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-align:center;
    color: var(--ink);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding: 28px 24px 22px;
  }

  .header-right{
    position:absolute;
    right: 28px;
    top:50%;
    transform: translateY(-50%);
    display:flex;
    align-items:center;
    gap: 18px;
  }

  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--ink);
    padding:4px;
    display:flex;
    align-items:center;
  }

  .text-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    background:none;
    border:none;
    color: var(--ink);
    cursor:pointer;
    padding:0;
  }

  .pill-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:500;
    letter-spacing: 0.12em;
    border: 1.4px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 22px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pill-btn:hover{ background: var(--ink); color: var(--paper); }

  .rule{
    height:1px;
    background: var(--line);
    margin: 0 28px;
  }

  .status-line{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 34px 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-align:right;
    min-height: 18px;
  }
  .status-line button{
    font-family:inherit; font-size:inherit; color: var(--private);
    background:none; border:none; cursor:pointer; letter-spacing:0.04em;
    text-decoration: underline;
  }

  main{
    display:grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1180px;
    margin: 0 auto;
    min-height: 70vh;
  }

  .divider{ background: var(--line); }

  .col{ padding: 30px 40px 60px; }

  .col-heading{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight:500;
    letter-spacing: 0.32em;
    text-align:center;
    color: var(--ink);
    margin-bottom: 30px;
  }

  /* ---- Essays ---- */
  .essay-item{
    margin-bottom: 26px;
    cursor:pointer;
  }
  .essay-head{
    display:flex;
    align-items:baseline;
    gap: 10px;
    flex-wrap:wrap;
  }
  .essay-title{
    font-family:'Lora', serif;
    font-size: 19px;
    color: var(--ink);
  }
  .essay-item.open .essay-title,
  .essay-item .essay-title.underline{
    text-decoration: underline;
    text-decoration-color: var(--hairline);
    text-underline-offset: 4px;
  }
  .stamp{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    padding: 2px 7px;
    border-radius: 3px;
    white-space:nowrap;
  }
  .stamp.private{ color: var(--private); background: var(--private-soft); border:1px solid var(--private-soft); }
  .stamp.public{ color: var(--public); background: var(--public-soft); border:1px solid var(--public-soft); }

  .essay-body{
    margin-top: 8px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 60ch;
  }
  .essay-locked{
    margin-top: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .essay-meta{
    margin-top: 6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .empty-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align:center;
    margin-top: 40px;
    line-height: 1.8;
  }

  /* ---- Social ---- */
  .post-card{ margin-bottom: 40px; }
  .post-img-wrap{
    width:100%;
    aspect-ratio: 16/9;
    overflow:hidden;
    background: #cfccc2;
    border: 1px solid var(--hairline);
  }
  .post-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .post-actions{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 12px;
  }
  .heart-btn{
    background:none; border:none; cursor:pointer; padding:0;
    color: var(--ink);
    display:flex; align-items:center;
  }
  .heart-btn svg{ width:20px; height:20px; }
  .post-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .post-caption{
    margin-top: 8px;
    font-size: 15.5px;
    color: var(--ink);
    line-height: 1.5;
  }
  .post-time{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(20,19,16,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal{
    background: var(--paper-raised);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--ink);
    padding: 28px 28px 24px;
    max-height: 88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 24px;
    letter-spacing: 0.06em;
    margin: 0 0 18px;
    text-align:center;
  }
  .tab-row{
    display:flex;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .tab-btn{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    padding: 9px 8px;
    background: transparent;
    border:none;
    cursor:pointer;
    color: var(--ink);
  }
  .tab-btn.active{ background: var(--ink); color: var(--paper); }

  label.field-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="url"], textarea{
    width:100%;
    font-family:'Lora', serif;
    font-size: 15px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    padding: 10px 11px;
    color: var(--ink);
    resize: vertical;
  }
  input:focus, textarea:focus{
    outline: none;
    border-color: var(--ink);
  }
  textarea{ min-height: 110px; line-height:1.5; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px;
    padding: 10px 12px;
    border: 1px solid var(--hairline);
  }
  .toggle-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
  }
  .switch{
    position:relative;
    width: 42px; height: 22px;
    border-radius: 999px;
    background: var(--public);
    cursor:pointer;
    transition: background .15s ease;
    flex-shrink:0;
  }
  .switch.is-private{ background: var(--private); }
  .switch .knob{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--paper);
    transition: left .15s ease;
  }
  .switch.is-private .knob{ left: 22px; }

  .modal-actions{
    display:flex; gap:10px; margin-top:24px;
  }
  .modal-actions button{ flex:1; }
  .btn-secondary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: transparent; border:1px solid var(--hairline); color: var(--ink-soft);
    padding: 10px; cursor:pointer;
  }
  .btn-primary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: var(--ink); border:1px solid var(--ink); color: var(--paper);
    padding: 10px; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }

  .field-error{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    margin-top: 6px;
  }

  @media (max-width: 760px){
    main{ grid-template-columns: 1fr; }
    .divider{ display:none; }
    .col{ padding: 26px 20px 40px; border-top: 1px solid var(--hairline); }
    .col:first-child{ border-top:none; }
    .wordmark{ font-size:20px; letter-spacing:0.32em; }
    .header-right{ right:16px; gap:12px; }
  }
</style>
</head>
<body>


<style>
  .auth-banner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 34px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    text-align:right;
    min-height: 16px;
  }
  .auth-toggle-text{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 18px;
  }
  .auth-toggle-text button{
    background:none; border:none; cursor:pointer;
    color: var(--ink); text-decoration: underline;
    font-family: inherit; font-size: inherit;
  }
  .spinner-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted); text-align:center; margin-top: 10px;
  }
</style>
<div id="app"></div>

<!-- Firebase SDKs (compat build — plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
(function(){

  // ---------- Firebase init ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBImhPZqC7r_yoGM7HsjsaN7ccAdlrR1KU",
    authDomain: "marchive-6ad4b.firebaseapp.com",
    projectId: "marchive-6ad4b",
    storageBucket: "marchive-6ad4b.firebasestorage.app",
    messagingSenderId: "512597243479",
    appId: "1:512597243479:web:c82bf53e28e1f6c91ed512",
    measurementId: "G-G4TCP6VYC2"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const state = {
    user: null,             // firebase user object | null
    authReady: false,
    publicEssays: [],
    privateEssays: [],
    posts: [],
    modal: null,            // null | 'compose' | 'auth'
    authMode: 'login',      // 'login' | 'signup'
    authError: null,
    authBusy: false,
    composeTab: 'essay',
    openEssayId: null,
    banner: null,
  };

  let listenersAttached = { publicEssays:false, posts:false, privateEssays:null };

  function el(tag, props, ...kids){
    const node = document.createElement(tag);
    if(props){
      for(const k in props){
        if(k === 'class') node.className = props[k];
        else if(k.startsWith('on') && typeof props[k] === 'function'){
          node.addEventListener(k.slice(2).toLowerCase(), props[k]);
        } else if(k === 'html'){
          node.innerHTML = props[k];
        } else {
          node.setAttribute(k, props[k]);
        }
      }
    }
    kids.flat().forEach(kid => {
      if(kid === null || kid === undefined || kid === false) return;
      if(typeof kid === 'string' || typeof kid === 'number') node.appendChild(document.createTextNode(kid));
      else node.appendChild(kid);
    });
    return node;
  }

  const ICONS = {
    search: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>`,
    heart: (filled) => `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7"><path d="M12 20.5s-7.5-4.6-10-9.3C0.3 8 1.6 4.6 4.8 3.6c2.2-0.7 4.4 0.2 5.7 2 .5.7 1 1.5 1.5 2.2.5-.7 1-1.5 1.5-2.2 1.3-1.8 3.5-2.7 5.7-2 3.2 1 4.5 4.4 2.8 7.6-2.5 4.7-10 9.3-10 9.3z"/></svg>`,
    lock: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  };

  function iconEl(svgString, cls){
    const span = el('span', cls ? {class: cls} : {});
    span.innerHTML = svgString;
    return span;
  }

  function fmtWordCount(text){
    const n = (text || '').trim().split(/\s+/).filter(Boolean).length;
    return n + (n === 1 ? ' word' : ' words');
  }

  function fmtDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  }

  function objToSortedArray(obj){
    if(!obj) return [];
    return Object.keys(obj).map(id => ({ id, ...obj[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  // ---------- auth state ----------
  auth.onAuthStateChanged(user => {
    state.user = user;
    state.authReady = true;

    // attach/detach the private-essays listener for this user
    if(listenersAttached.privateEssays && listenersAttached.privateEssays !== (user ? user.uid : null)){
      db.ref('privateEssays/' + listenersAttached.privateEssays).off();
      listenersAttached.privateEssays = null;
      state.privateEssays = [];
    }
    if(user && !listenersAttached.privateEssays){
      listenersAttached.privateEssays = user.uid;
      db.ref('privateEssays/' + user.uid).on('value', snap => {
        state.privateEssays = objToSortedArray(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load private entries: ' + err.message;
        render();
      });
    }
    render();
  });

  if(!listenersAttached.publicEssays){
    listenersAttached.publicEssays = true;
    db.ref('publicEssays').on('value', snap => {
      state.publicEssays = objToSortedArray(snap.val());
      render();
    }, err => {
      state.banner = 'Could not load essays: ' + err.message;
      render();
    });
  }
  if(!listenersAttached.posts){
    listenersAttached.posts = true;
    db.ref('posts').on('value', snap => {
      state.posts = objToSortedArray(snap.val());
      render();
    }, err => {
      state.banner = 'Could not load posts: ' + err.message;
      render();
    });
  }

  // ---------- render ----------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(Header());
    app.appendChild(el('div', {class:'rule'}));
    app.appendChild(StatusLine());
    if(!state.authReady){
      app.appendChild(el('div', {class:'empty-note', style:'padding:60px 0;'}, 'connecting to archive…'));
    } else {
      app.appendChild(Main());
    }
    if(state.modal === 'compose') app.appendChild(ComposeModal());
    if(state.modal === 'auth') app.appendChild(AuthModal());
  }

  function Header(){
    return el('header', {},
      el('div', {class:'wordmark'}, 'ARCHIVES'),
      el('div', {class:'header-right'},
        iconEl(ICONS.search, 'icon-btn'),
        el('button', {class:'text-link', onClick: onLoginClick}, state.user ? 'LOG OUT' : 'LOG IN'),
        el('button', {class:'pill-btn', onClick: onPostClick}, 'POST'),
      )
    );
  }

  function onLoginClick(){
    if(state.user){
      auth.signOut();
    } else {
      state.modal = 'auth';
      state.authMode = 'login';
      state.authError = null;
      render();
    }
  }

  function onPostClick(){
    if(!state.user){
      state.modal = 'auth';
      state.authMode = 'login';
      state.authError = 'Log in to post an entry.';
      render();
      return;
    }
    state.modal = 'compose';
    state.composeTab = 'essay';
    render();
  }

  function StatusLine(){
    const wrap = el('div', {class:'status-line'});
    if(state.banner){
      wrap.appendChild(document.createTextNode(state.banner + ' '));
      wrap.appendChild(el('button', {onClick: () => { state.banner = null; render(); }}, 'dismiss'));
    } else if(state.user){
      wrap.appendChild(document.createTextNode('signed in as ' + state.user.email));
    } else {
      wrap.appendChild(document.createTextNode('viewing as guest — private entries hidden'));
    }
    return wrap;
  }

  function Main(){
    return el('main', {},
      Column('essays'),
      el('div', {class:'divider'}),
      Column('social'),
    );
  }

  function Column(kind){
    if(kind === 'essays'){
      const col = el('div', {class:'col'}, el('div', {class:'col-heading'}, 'ESSAYS'));
      const combined = [
        ...state.privateEssays.map(e => ({...e, private:true})),
        ...state.publicEssays.map(e => ({...e, private:false})),
      ].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

      if(combined.length === 0){
        col.appendChild(el('div', {class:'empty-note'}, 'Nothing written yet.', el('br'), 'Press POST to start an entry.'));
        return col;
      }
      combined.forEach(essay => col.appendChild(EssayItem(essay)));
      return col;
    } else {
      const col = el('div', {class:'col'}, el('div', {class:'col-heading'}, 'SOCIAL MEDIA POST'));
      if(state.posts.length === 0){
        col.appendChild(el('div', {class:'empty-note'}, 'No posts yet.', el('br'), 'Press POST to share something nerdy.'));
        return col;
      }
      state.posts.forEach(post => col.appendChild(PostCard(post)));
      return col;
    }
  }

  function EssayItem(essay){
    const isOpen = state.openEssayId === essay.id;
    const item = el('div', {class: 'essay-item' + (isOpen ? ' open' : '')});
    const head = el('div', {class:'essay-head', onClick: () => {
      state.openEssayId = isOpen ? null : essay.id;
      render();
    }},
      el('span', {class:'essay-title' + (isOpen ? ' underline' : '')}, essay.title),
      el('span', {class: 'stamp ' + (essay.private ? 'private' : 'public')}, essay.private ? 'PRIVATE' : 'PUBLIC'),
    );
    item.appendChild(head);

    if(isOpen){
      item.appendChild(el('div', {class:'essay-body'}, essay.body));
      item.appendChild(el('div', {class:'essay-meta'}, fmtDate(essay.createdAt) + ' · ' + fmtWordCount(essay.body)));
    }
    return item;
  }

  function PostCard(post){
    const card = el('div', {class:'post-card'});
    if(post.image){
      const imgWrap = el('div', {class:'post-img-wrap'});
      const img = el('img', {src: post.image, alt: 'post image'});
      img.onerror = () => { imgWrap.style.display = 'none'; };
      imgWrap.appendChild(img);
      card.appendChild(imgWrap);
    }
    const likedByMe = !!(post.likes && state.user && post.likes[state.user.uid]);
    const actions = el('div', {class:'post-actions'},
      el('button', {class:'heart-btn', onClick: () => toggleLike(post)}, iconEl(ICONS.heart(likedByMe))),
    );
    card.appendChild(actions);
    card.appendChild(el('div', {class:'post-caption'}, post.caption));
    card.appendChild(el('div', {class:'post-time'}, fmtDate(post.createdAt)));
    return card;
  }

  function toggleLike(post){
    if(!state.user){
      state.modal = 'auth';
      state.authMode = 'login';
      state.authError = 'Log in to like a post.';
      render();
      return;
    }
    const ref = db.ref('posts/' + post.id + '/likes/' + state.user.uid);
    const currentlyLiked = !!(post.likes && post.likes[state.user.uid]);
    ref.set(currentlyLiked ? null : true).catch(err => {
      state.banner = 'Could not update like: ' + err.message;
      render();
    });
  }

  // ---------- auth modal ----------
  function AuthModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay && !state.authBusy) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, state.authMode === 'login' ? 'Log In' : 'Sign Up'));

    if(state.authError){
      modal.appendChild(el('div', {class:'field-error', style:'text-align:center; margin-bottom:10px;'}, state.authError));
    }

    const emailLabel = el('label', {class:'field-label'}, 'EMAIL');
    const emailInput = el('input', {type:'text', placeholder:'you@example.com'});
    const passLabel = el('label', {class:'field-label'}, 'PASSWORD');
    const passInput = el('input', {type:'password', placeholder:'••••••••'});

    modal.appendChild(emailLabel);
    modal.appendChild(emailInput);
    modal.appendChild(passLabel);
    modal.appendChild(passInput);

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel');
    const submitBtn = el('button', {class:'btn-primary', onClick: async () => {
      const email = emailInput.value.trim();
      const password = passInput.value;
      if(!email || !password){
        state.authError = 'Email and password are both required.';
        render();
        return;
      }
      state.authBusy = true;
      state.authError = null;
      render();
      try{
        if(state.authMode === 'login'){
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          await auth.createUserWithEmailAndPassword(email, password);
        }
        state.authBusy = false;
        closeModal();
      } catch(err){
        state.authBusy = false;
        state.authError = err.message;
        render();
      }
    }}, state.authBusy ? 'Please wait…' : (state.authMode === 'login' ? 'Log in' : 'Create account'));
    submitBtn.disabled = state.authBusy;
    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    modal.appendChild(actions);

    modal.appendChild(el('div', {class:'auth-toggle-text'},
      state.authMode === 'login' ? "Don't have an account? " : 'Already have an account? ',
      el('button', {onClick: () => {
        state.authMode = state.authMode === 'login' ? 'signup' : 'login';
        state.authError = null;
        render();
      }}, state.authMode === 'login' ? 'Sign up' : 'Log in'),
    ));

    overlay.appendChild(modal);
    return overlay;
  }

  function closeModal(){
    state.modal = null;
    state.authError = null;
    render();
  }

  // ---------- compose modal ----------
  function ComposeModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'New Entry'));

    const tabs = el('div', {class:'tab-row'},
      el('button', {class:'tab-btn' + (state.composeTab === 'essay' ? ' active' : ''), onClick: () => { state.composeTab = 'essay'; render(); }}, 'ESSAY'),
      el('button', {class:'tab-btn' + (state.composeTab === 'social' ? ' active' : ''), onClick: () => { state.composeTab = 'social'; render(); }}, 'SOCIAL POST'),
    );
    modal.appendChild(tabs);

    if(state.composeTab === 'essay') modal.appendChild(EssayForm());
    else modal.appendChild(SocialForm());

    overlay.appendChild(modal);
    return overlay;
  }

  function EssayForm(){
    const form = el('div', {});
    let isPrivate = false;
    let errorEl = null;

    const titleLabel = el('label', {class:'field-label'}, 'TITLE');
    const titleInput = el('input', {type:'text', placeholder:'e.g. What is Meningitis'});

    const bodyLabel = el('label', {class:'field-label'}, 'ENTRY');
    const bodyInput = el('textarea', {placeholder:'Write your essay…'});

    const toggleRow = el('div', {class:'toggle-row'});
    const toggleLabel = el('span', {class:'toggle-row-label'}, 'PRIVATE — only visible to you, signed in');
    const switchEl = el('div', {class:'switch'});
    switchEl.appendChild(el('div', {class:'knob'}));
    switchEl.addEventListener('click', () => {
      isPrivate = !isPrivate;
      switchEl.classList.toggle('is-private', isPrivate);
    });
    toggleRow.appendChild(toggleLabel);
    toggleRow.appendChild(switchEl);

    form.appendChild(titleLabel);
    form.appendChild(titleInput);
    form.appendChild(bodyLabel);
    form.appendChild(bodyInput);
    form.appendChild(toggleRow);

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel');
    const saveBtn = el('button', {class:'btn-primary', onClick: async () => {
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if(!title || !body){
        if(!errorEl){
          errorEl = el('div', {class:'field-error'}, 'Title and entry text are both required.');
          form.appendChild(errorEl);
        }
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const uid = state.user.uid;
      const path = isPrivate ? 'privateEssays/' + uid : 'publicEssays';
      const newRef = db.ref(path).push();
      try{
        await newRef.set({
          title, body,
          ownerUid: uid,
          createdAt: firebase.database.ServerValue.TIMESTAMP,
        });
        closeModal();
      } catch(err){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Publish entry';
        if(!errorEl){
          errorEl = el('div', {class:'field-error'});
          form.appendChild(errorEl);
        }
        errorEl.textContent = 'Could not save: ' + err.message;
      }
    }}, 'Publish entry');
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    form.appendChild(actions);

    return form;
  }

  function SocialForm(){
    const form = el('div', {});
    let errorEl = null;

    const imgLabel = el('label', {class:'field-label'}, 'IMAGE URL (optional)');
    const imgInput = el('input', {type:'url', placeholder:'https://…'});

    const capLabel = el('label', {class:'field-label'}, 'CAPTION');
    const capInput = el('textarea', {placeholder:'Say something nerdy…', style:'min-height:70px;'});

    form.appendChild(imgLabel);
    form.appendChild(imgInput);
    form.appendChild(capLabel);
    form.appendChild(capInput);

    const note = el('div', {class:'essay-meta', style:'margin-top:14px;'}, 'Social posts are always public — visible to anyone viewing the archive.');
    form.appendChild(note);

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: closeModal}, 'Cancel');
    const saveBtn = el('button', {class:'btn-primary', onClick: async () => {
      const caption = capInput.value.trim();
      if(!caption){
        if(!errorEl){
          errorEl = el('div', {class:'field-error'}, 'Caption is required.');
          form.appendChild(errorEl);
        }
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Posting…';
      const uid = state.user.uid;
      const newRef = db.ref('posts').push();
      try{
        await newRef.set({
          image: imgInput.value.trim(),
          caption,
          ownerUid: uid,
          likes: {},
          createdAt: firebase.database.ServerValue.TIMESTAMP,
        });
        closeModal();
      } catch(err){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Share post';
        if(!errorEl){
          errorEl = el('div', {class:'field-error'});
          form.appendChild(errorEl);
        }
        errorEl.textContent = 'Could not post: ' + err.message;
      }
    }}, 'Share post');
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    form.appendChild(actions);

    return form;
  }

  render();
})();
</script>
</body>
</html>
