<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marchives</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e7e4dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e7e4dc;
    --paper-raised: #edeae2;
    --ink: #1b1a17;
    --ink-soft: #3a382f;
    --muted: #78745f;
    --line: #1b1a17;
    --hairline: rgba(27,26,23,0.14);
    --private: #6b2b3a;
    --private-soft: #6b2b3a1a;
    --public: #45573f;
    --public-soft: #45573f1a;
    --followers: #4a5a78;
    --followers-soft: #4a5a781a;
    --paper-shadow: rgba(27,26,23,0.08);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.02) 0, transparent 40%);
  }

  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 28px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-align:center;
    color: var(--ink);
    grid-column: 2;
    white-space: nowrap;
  }

  header{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    column-gap: 14px;
    padding: 28px 24px 22px;
  }

  .header-right{
    grid-column: 3;
    justify-self: end;
    display:flex;
    align-items:center;
    gap: 18px;
    min-width: 0;
  }

  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--ink);
    padding:4px;
    display:flex;
    align-items:center;
    position: relative;
  }

  .icon-badge{
    position: absolute;
    top: -2px;
    right: -4px;
    min-width: 14px;
    height: 14px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--private);
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    line-height: 14px;
    text-align: center;
  }

  .text-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    background:none;
    border:none;
    color: var(--ink);
    cursor:pointer;
    padding:0;
  }

  .pill-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:500;
    letter-spacing: 0.12em;
    border: 1.4px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 22px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pill-btn:hover{ background: var(--ink); color: var(--paper); }

  .rule{
    height:1px;
    background: var(--line);
    margin: 0 28px;
  }

  .status-line{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 34px 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-align:right;
    min-height: 18px;
  }
  .status-line button{
    font-family:inherit; font-size:inherit; color: var(--private);
    background:none; border:none; cursor:pointer; letter-spacing:0.04em;
    text-decoration: underline;
  }

  main{
    display:grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1180px;
    margin: 0 auto;
    min-height: 70vh;
  }

  .divider{ background: var(--line); }

  .col{ padding: 30px 40px 60px; }

  .col-heading{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight:500;
    letter-spacing: 0.32em;
    text-align:center;
    color: var(--ink);
    margin-bottom: 30px;
  }

  /* ---- Essays ---- */
  .essay-item{
    margin-bottom: 26px;
    cursor:pointer;
  }
  .essay-head{
    display:flex;
    align-items:baseline;
    gap: 10px;
    flex-wrap:wrap;
  }
  .essay-title{
    font-family:'Lora', serif;
    font-size: 19px;
    color: var(--ink);
  }
  .essay-item.open .essay-title,
  .essay-item .essay-title.underline{
    text-decoration: underline;
    text-decoration-color: var(--hairline);
    text-underline-offset: 4px;
  }
  .stamp{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    padding: 2px 7px;
    border-radius: 3px;
    white-space:nowrap;
  }
  .stamp.private{ color: var(--private); background: var(--private-soft); border:1px solid var(--private-soft); }
  .stamp.public{ color: var(--public); background: var(--public-soft); border:1px solid var(--public-soft); }
  .stamp.followers{ color: var(--followers); background: var(--followers-soft); border:1px solid var(--followers-soft); }

  .vis-select{
    display:flex;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
  }
  .vis-option{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-right: 1px solid var(--hairline);
    color: var(--ink);
    cursor: pointer;
  }
  .vis-option:last-child{ border-right: none; }
  .vis-option.active{ background: var(--ink); color: var(--paper); }

  .essay-body{
    margin-top: 8px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 60ch;
  }
  .essay-locked{
    margin-top: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .essay-meta{
    margin-top: 6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .empty-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align:center;
    margin-top: 40px;
    line-height: 1.8;
  }

  /* ---- Social ---- */
  .post-card{ margin-bottom: 40px; }
  .post-img-wrap{
    width:100%;
    aspect-ratio: 16/9;
    overflow:hidden;
    background: #cfccc2;
    border: 1px solid var(--hairline);
  }
  .post-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .post-actions{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 12px;
  }
  .heart-btn{
    background:none; border:none; cursor:pointer; padding:0;
    color: var(--ink);
    display:flex; align-items:center;
  }
  .heart-btn svg{ width:20px; height:20px; }

  .like-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-left: -4px;
  }
  .post-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .post-caption{
    margin-top: 8px;
    font-size: 15.5px;
    color: var(--ink);
    line-height: 1.5;
  }
  .post-audio-wrap{
    margin-top: 10px;
    padding: 8px 12px;
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .post-audio-title{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .sound-toggle-btn{
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    width: 30px; height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    cursor: pointer;
  }
  .sound-toggle-btn:hover{ border-color: var(--ink); }
  .sound-toggle-btn.playing{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .post-time{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(20,19,16,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal{
    background: var(--paper-raised);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--ink);
    padding: 28px 28px 24px;
    max-height: 88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 24px;
    letter-spacing: 0.06em;
    margin: 0 0 18px;
    text-align:center;
  }
  .tab-row{
    display:flex;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .tab-btn{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    padding: 9px 8px;
    background: transparent;
    border:none;
    cursor:pointer;
    color: var(--ink);
  }
  .tab-btn.active{ background: var(--ink); color: var(--paper); }

  label.field-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="url"], textarea{
    width:100%;
    font-family:'Lora', serif;
    font-size: 15px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    padding: 10px 11px;
    color: var(--ink);
    resize: vertical;
  }
  input:focus, textarea:focus{
    outline: none;
    border-color: var(--ink);
  }
  textarea{ min-height: 110px; line-height:1.5; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px;
    padding: 10px 12px;
    border: 1px solid var(--hairline);
  }
  .toggle-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
  }
  .switch{
    position:relative;
    width: 42px; height: 22px;
    border-radius: 999px;
    background: var(--public);
    cursor:pointer;
    transition: background .15s ease;
    flex-shrink:0;
  }
  .switch.is-private{ background: var(--private); }
  .switch .knob{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--paper);
    transition: left .15s ease;
  }
  .switch.is-private .knob{ left: 22px; }

  .modal-actions{
    display:flex; gap:10px; margin-top:24px;
  }
  .modal-actions button{ flex:1; }
  .btn-secondary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: transparent; border:1px solid var(--hairline); color: var(--ink-soft);
    padding: 10px; cursor:pointer;
  }
  .btn-primary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: var(--ink); border:1px solid var(--ink); color: var(--paper);
    padding: 10px; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }

  .field-error{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    margin-top: 6px;
  }

  @media (max-width: 760px){
    main{ grid-template-columns: 1fr; }
    .divider{ display:none; }
    .col{ padding: 26px 20px 40px; border-top: 1px solid var(--hairline); }
    .col:first-child{ border-top:none; }

    header{
      grid-template-columns: 1fr;
      row-gap: 14px;
      padding: 20px 16px 16px;
    }
    .wordmark{
      grid-column: 1;
      font-size: 18px;
      letter-spacing: 0.26em;
      text-indent: 0.26em;
    }
    .header-right{
      grid-column: 1;
      justify-self: stretch;
      width: 100%;
      justify-content: space-between;
      gap: 10px;
    }
    .rule{ margin: 0 16px; }
    .status-line{ padding: 8px 16px 0; }
  }

  @media (max-width: 360px){
    .wordmark{ font-size:16px; letter-spacing:0.18em; text-indent:0.18em; }
  }

  @media (max-width: 640px){
    .doc-topbar{ padding: 14px 16px; }
    .doc-toolbar{ padding: 8px 16px; gap: 6px; }
    .doc-tool-btn{ padding: 5px 8px; font-size: 11px; }
    .doc-body-wrap{ padding: 28px 18px 100px; }
    .doc-title-input, .doc-title-display{ font-size: 26px; }
    .doc-editable, .doc-read-body{ font-size: 16px; }
  }
</style>
</head>
<body>


<style>
  .auth-banner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 34px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    text-align:right;
    min-height: 16px;
  }
  .auth-toggle-text{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 18px;
  }
  .auth-toggle-text button{
    background:none; border:none; cursor:pointer;
    color: var(--ink); text-decoration: underline;
    font-family: inherit; font-size: inherit;
  }
  .spinner-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted); text-align:center; margin-top: 10px;
  }

  .image-picker{
    border: 1px dashed var(--hairline);
    padding: 14px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .image-picker input[type="file"]{ display:none; }
  .image-picker-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .image-picker-btn:hover{ background: var(--ink); color: var(--paper); }
  .image-picker-status{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .image-preview-wrap{
    position: relative;
    margin-top: 12px;
  }
  .image-preview-wrap img{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--hairline);
  }
  .image-preview-remove{
    position: absolute;
    top: 8px; right: 8px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 999px;
    width: 26px; height: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .post-image-thumb{
    position: relative;
    width: 140px;
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid var(--hairline);
    background: #cfccc2;
  }
  .post-image-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .post-image-thumb .image-preview-remove{
    width: 22px; height: 22px;
    top: 5px; right: 5px;
    font-size: 12px;
  }
  .upload-progress{
    margin-top: 10px;
    height: 4px;
    background: var(--hairline);
    overflow: hidden;
  }
  .upload-progress-bar{
    height: 100%;
    background: var(--private);
    width: 0%;
    transition: width .15s ease;
  }
  .or-divider{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin: 12px 0;
    letter-spacing: 0.1em;
  }

  .delete-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--muted);
    padding: 2px;
    display:flex;
    align-items:center;
    flex-shrink:0;
    margin-left: auto;
  }
  .delete-btn:hover{ color: var(--private); }

  .inline-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    background:none;
    border:none;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .inline-link:hover{ color: var(--private); }

  /* ---- full-page essay document (editor + reader) ---- */
  .doc-page{
    position: fixed;
    inset: 0;
    background: var(--paper);
    overflow-y: auto;
    z-index: 70;
  }
  .doc-topbar{
    position: sticky;
    top: 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding: 18px 24px;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
    z-index: 2;
  }
  .doc-topbar-left{ display:flex; align-items:center; gap:14px; }
  .doc-toolbar{
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap: 4px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--paper-raised);
  }
  .doc-tool-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--hairline);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 3px;
  }
  .doc-tool-btn:hover{ border-color: var(--ink); }
  .doc-body-wrap{
    max-width: 700px;
    margin: 0 auto;
    padding: 44px 24px 120px;
  }
  .doc-title-input{
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    padding: 0;
    margin-bottom: 8px;
  }
  .doc-title-input:focus{ outline: none; }
  .doc-title-display{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .doc-editable{
    min-height: 320px;
    font-family: 'Lora', serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .doc-editable:focus{ outline: none; }
  .doc-editable[data-placeholder]:empty:before{
    content: attr(data-placeholder);
    color: var(--muted);
  }
  .doc-editable p, .doc-editable div{ margin: 0 0 1em; }
  .doc-editable ul, .doc-editable ol{ margin: 0 0 1em; padding-left: 1.4em; }
  .doc-editable blockquote{
    margin: 0 0 1em;
    padding-left: 14px;
    border-left: 2px solid var(--hairline);
    color: var(--muted);
  }
  .doc-read-body{
    font-family: 'Lora', serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .doc-read-body p, .doc-read-body div{ margin: 0 0 1em; }
  .doc-read-body ul, .doc-read-body ol{ margin: 0 0 1em; padding-left: 1.4em; }
  .doc-read-body blockquote{
    margin: 0 0 1em;
    padding-left: 14px;
    border-left: 2px solid var(--hairline);
    color: var(--muted);
  }
  .doc-section-heading{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin: 44px 0 14px;
  }
  .doc-bib-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items:center;
  }
  .doc-bib-row input{ flex:1; }
  .doc-bib-list{
    font-family:'Lora', serif;
    font-size: 14.5px;
    color: var(--ink-soft);
  }
  .doc-bib-list li{ margin-bottom: 6px; }
  .doc-bib-list a{ color: var(--ink); }
  .doc-post-picker{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .doc-post-tile{
    flex: 0 0 auto;
    width: 96px;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 3px;
    border-radius: 4px;
  }
  .doc-post-tile.selected{ border-color: var(--private); }
  .doc-post-tile img{
    width: 90px; height: 90px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--hairline);
  }
  .doc-post-tile-caption{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 4px;

          node.addEventListener(k.slice(2).toLowerCase(), props[k]);
        } else if(k === 'html'){
          node.innerHTML = props[k];
        } else {
          node.setAttribute(k, props[k]);
        }
      }
    }
    kids.flat().forEach(kid => {
      if(kid === null || kid === undefined || kid === false) return;
      if(typeof kid === 'string' || typeof kid === 'number') node.appendChild(document.createTextNode(kid));
      else node.appendChild(kid);

  // ---------- visibility (public / followers / private) ----------
  const VISIBILITY_LABELS = { public: 'PUBLIC', followers: 'FOLLOWERS', private: 'ONLY ME' };

  function getVisibility(item){
    if(item.visibility) return item.visibility;
    return item.private ? 'private' : 'public'; // backward-compat with older binary data

  // Dynamic per-followed-author listeners for followers-only content — attached for
  // yourself plus everyone you follow, kept in sync whenever your following list changes.
  let followersListeners = { essays: {}, posts: {} };
  let followersData = { essays: {}, posts: {} };

  function syncFollowersCollectionListeners(kind, path){
    const wanted = new Set(state.user ? [state.user.uid, ...Object.keys(state.myFollowing || {})] : []);
    Object.keys(followersListeners[kind]).forEach(uid => {
      if(!wanted.has(uid)){
        db.ref(path + '/' + uid).off();
        delete followersListeners[kind][uid];
        delete followersData[kind][uid];
      }
    });
    wanted.forEach(uid => {
      if(!followersListeners[kind][uid]){
        followersListeners[kind][uid] = true;
        db.ref(path + '/' + uid).on('value', snap => {
          followersData[kind][uid] = objToSortedArray(snap.val());
          render();
        }, () => {}); // a missing/denied node just means no followers-only items from them yet
      }
    });
  }

  function resetFollowersCollectionListeners(){
    ['essays', 'posts'].forEach(kind => {
      Object.keys(followersListeners[kind]).forEach(uid => {

      });
      followersListeners[kind] = {};
      followersData[kind] = {};
    });
  }

  // Combines public + your own private + followers-only content from yourself and
  // everyone you follow into one list, tagging each item with its resolved visibility.
  function allVisibleEssays(){
    const own = state.user ? state.privateEssays.map(e => ({...e, visibility:'private'})) : [];
    const followersItems = Object.values(followersData.essays).flat().map(e => ({...e, visibility:'followers'}));
    const pub = state.publicEssays.map(e => ({...e, visibility: e.visibility || 'public'}));
    return [...own, ...followersItems, ...pub].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  function allVisiblePosts(){
    const own = state.user ? state.privatePosts.map(p => ({...p, visibility:'private'})) : [];
    const followersItems = Object.values(followersData.posts).flat().map(p => ({...p, visibility:'followers'}));
    const pub = state.posts.map(p => ({...p, visibility: p.visibility || 'public'}));
    return [...own, ...followersItems, ...pub].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

    const v = getVisibility(essay);
    if(v === 'private') return 'privateEssays/' + essay.ownerUid + '/' + essay.id;
    if(v === 'followers') return 'followersEssays/' + essay.ownerUid + '/' + essay.id;
    return 'publicEssays/' + essay.id;
  }

  function postPath(post){
    const v = getVisibility(post);
    if(v === 'private') return 'privatePosts/' + post.ownerUid + '/' + post.id;
    if(v === 'followers') return 'followersPosts/' + post.ownerUid + '/' + post.id;
    return 'posts/' + post.id;
  }

  // A small reusable segmented control for picking public / followers / private.
  function visibilitySelector(getValue, setValue, onChange){
    const wrap = el('div', {class:'vis-select'});
    function render_(){
      wrap.innerHTML = '';
      ['public', 'followers', 'private'].forEach(v => {
        const btn = el('button', {
          type:'button',
          class:'vis-option' + (getValue() === v ? ' active' : ''),
          onClick: () => { setValue(v); render_(); if(onChange) onChange(v); },
        }, v === 'public' ? 'Public' : v === 'followers' ? 'Followers' : 'Only Me');
        wrap.appendChild(btn);
      });
    }
    render_();
    return wrap;
  }

  function saveDraft(draftId, payload){
    if(!state.user) return Promise.resolve();
    return db.ref('drafts/' + state.user.uid + '/' + draftId).set({
      ...payload,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
    }).catch(() => {}); // autosave failures are silent — not worth interrupting someone's writing
  }

  function deleteDraftEntry(draftId){
    if(!state.user) return Promise.resolve();
    return db.ref('drafts/' + state.user.uid + '/' + draftId).remove().catch(() => {});
  }

  function newDraftId(){
    return 'd' + Date.now() + Math.random().toString(36).slice(2, 8);
  }

  function fmtDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  }

  function currentAuthorName(){
    if(!state.user) return null;
    if(state.profile && state.profile.username) return state.profile.username;
    return state.user.email ? state.user.email.split('@')[0] : 'anonymous';
  }

  function objToSortedArray(obj){
    if(!obj) return [];
    return Object.keys(obj).map(id => ({ id, ...obj[id] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  function objToSortedArrayAsc(obj){
    if(!obj) return [];
    return Object.keys(obj).map(id => ({ id, ...obj[id] })).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  }

  function convoIdFor(a, b){
    return [a, b].sort().join('_');
  }

  // Hardcoded admin — safe by design: this is baked into the deployed code, not stored
  // data, so it can't be tampered with from the client. Matched against by the security
  // rules too (same UID literal), which is what actually grants the delete power.
  const ADMIN_UIDS = ['as5vTerRgTZAgEOBBy2fYHOOfoq2'];
  function isAdmin(){
    return !!(state.user && ADMIN_UIDS.includes(state.user.uid));
  }

  function isFollowing(uid){
    return !!(state.myFollowing && state.myFollowing[uid]);
  }

  function unreadConversationCount(){
    if(!state.user) return 0;

  }

  function followUser(targetUid){

    updates['follows/' + state.user.uid + '/' + targetUid] = true;
    updates['followers/' + targetUid + '/' + state.user.uid] = true;
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not follow: ' + err.message;
      render();
    });
  }

  function unfollowUser(targetUid){
    if(!state.user) return;
    const updates = {};
    updates['follows/' + state.user.uid + '/' + targetUid] = null;
    updates['followers/' + targetUid + '/' + state.user.uid] = null;
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not unfollow: ' + err.message;
      render();
    });
  }

  const profileCache = {}; // uid -> username | null, memoized across openNetworkModal calls

  function openNetworkModal(tab){
    if(!state.user){ requireLogin('Log in to see your network.'); return; }

    state.networkLoading = true;
    render();
    loadNetworkLists();
  }

  async function loadNetworkLists(){
    const followingUids = Object.keys(state.myFollowing || {});
    const followerUids = Object.keys(state.myFollowers || {});
    const uidsToFetch = [...new Set([...followingUids, ...followerUids])].filter(uid => !(uid in profileCache));
    try{
      const fetched = await Promise.all(uidsToFetch.map(uid =>
        db.ref('profiles/' + uid).once('value').then(snap => ({ uid, username: (snap.val() && snap.val().username) || null }))
      ));
      fetched.forEach(f => { profileCache[f.uid] = f.username; });
    } catch(err){
      state.banner = 'Could not load some profiles: ' + err.message;
    }
    state.networkFollowing = followingUids.map(uid => ({ uid, username: profileCache[uid] }));
    state.networkFollowers = followerUids.map(uid => ({ uid, username: profileCache[uid] }));
    state.networkLoading = false;
    render();
  }

  function markConversationRead(otherUid){
    if(!state.user) return;
    db.ref('userConversations/' + state.user.uid + '/' + otherUid + '/lastReadAt')

  function openConversation(otherUid, otherUsername){
    if(!state.user){ requireLogin('Log in to send messages.'); return; }
    if(listenersAttached.thread && listenersAttached.thread !== otherUid){
      db.ref('messages/' + convoIdFor(state.user.uid, listenersAttached.thread)).off();
      listenersAttached.thread = null;

    state.activeConversationUid = otherUid;
    state.activeConversationUsername = otherUsername || otherUid;
    state.messageDraft = '';
    state.modal = 'messages';
    markConversationRead(otherUid);
    if(!listenersAttached.thread){
      listenersAttached.thread = otherUid;

        state.activeMessages = objToSortedArrayAsc(snap.val());

    state.activeConversationUid = null;
    state.activeConversationUsername = null;
    state.activeMessages = [];
    state.messageDraft = '';
    render();
  }

  function sendMessage(){
    const text = (state.messageDraft || '').trim();
    if(!text || !state.user || !state.activeConversationUid) return;
    const myUid = state.user.uid;
    const otherUid = state.activeConversationUid;
    const cid = convoIdFor(myUid, otherUid);
    const msgKey = db.ref('messages/' + cid).push().key;
    const myName = currentAuthorName();
    const updates = {};
    updates['messages/' + cid + '/' + msgKey] = {
      from: myUid, to: otherUid, text,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    };
    updates['userConversations/' + myUid + '/' + otherUid] = {
      lastMessage: text, lastAt: firebase.database.ServerValue.TIMESTAMP,
      lastFrom: myUid, username: state.activeConversationUsername,
    };
    updates['userConversations/' + otherUid + '/' + myUid] = {
      lastMessage: text, lastAt: firebase.database.ServerValue.TIMESTAMP,
      lastFrom: myUid, username: myName,
    };
    state.messageDraft = '';
    db.ref().update(updates).catch(err => {
      state.banner = 'Could not send message: ' + err.message;
      render();
    });
  }

  auth.onAuthStateChanged(user => {

    // attach/detach the private-essays listener for this user
    if(listenersAttached.privateEssays && listenersAttached.privateEssays !== (user ? user.uid : null)){
      db.ref('privateEssays/' + listenersAttached.privateEssays).off();
      listenersAttached.privateEssays = null;
      state.privateEssays = [];
    }
    if(user && !listenersAttached.privateEssays){
      listenersAttached.privateEssays = user.uid;
      db.ref('privateEssays/' + user.uid).on('value', snap => {
        state.privateEssays = objToSortedArray(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load private entries: ' + err.message;
        render();

      db.ref('privatePosts/' + listenersAttached.privatePosts).off();
      listenersAttached.privatePosts = null;
      state.privatePosts = [];
    }
    if(user && !listenersAttached.privatePosts){
      listenersAttached.privatePosts = user.uid;
      db.ref('privatePosts/' + user.uid).on('value', snap => {
        state.privatePosts = objToSortedArray(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load private posts: ' + err.message;
        render();
      });
    }

    // attach/detach the drafts listener for this user
    if(listenersAttached.drafts && listenersAttached.drafts !== (user ? user.uid : null)){
      db.ref('drafts/' + listenersAttached.drafts).off();
      listenersAttached.drafts = null;
      state.myDrafts = [];
    }
    if(user && !listenersAttached.drafts){
      listenersAttached.drafts = user.uid;
      db.ref('drafts/' + user.uid).on('value', snap => {
        state.myDrafts = objToSortedArray(snap.val());
        render();
      }, err => {
        state.banner = 'Could not load drafts: ' + err.message;
        render();
      });
    }

    // attach/detach the profile (username) listener for this user
    if(listenersAttached.profile && listenersAttached.profile !== (user ? user.uid : null)){
      db.ref('profiles/' + listenersAttached.profile).off();
      listenersAttached.profile = null;
      state.profile = null;
    }
    if(user && !listenersAttached.profile){
      listenersAttached.profile = user.uid;
      db.ref('profiles/' + user.uid).on('value', snap => {
        state.profile = snap.val();
        render();
      }, err => {
        state.banner = 'Could not load profile: ' + err.message;
        render();
      });
    }

    // attach/detach the follows listener for this user
    if(listenersAttached.follows && listenersAttached.follows !== (user ? user.uid : null)){
      db.ref('follows/' + listenersAttached.follows).off();
      listenersAttached.follows = null;
      state.myFollowing = {};
      resetFollowersCollectionListeners();
    }
    if(user && !listenersAttached.follows){
      listenersAttached.follows = user.uid;
      db.ref('follows/' + user.uid).on('value', snap => {
        state.myFollowing = snap.val() || {};
        syncFollowersCollectionListeners('essays', 'followersEssays');
        syncFollowersCollectionListeners('posts', 'followersPosts');
        render();
      }, err => {
        state.banner = 'Could not load follows: ' + err.message;
        render();
      });
    }

    // attach/detach the followers-list listener for this user (who follows me)
    if(listenersAttached.followersList && listenersAttached.followersList !== (user ? user.uid : null)){
      db.ref('followers/' + listenersAttached.followersList).off();
      listenersAttached.followersList = null;
      state.myFollowers = {};

    if(user && !listenersAttached.followersList){

        state.myFollowers = snap.val() || {};
        render();
      }, err => {
        state.banner = 'Could not load followers: ' + err.message;
        render();
      });
    }

    // attach/detach the conversation-index listener for this user
    if(listenersAttached.conversations && listenersAttached.conversations !== (user ? user.uid : null)){
      db.ref('userConversations/' + listenersAttached.conversations).off();
      listenersAttached.conversations = null;
      state.conversations = [];
      convosInitialized = false;
      lastKnownConvoAt = {};

    if(user && !listenersAttached.conversations){
      listenersAttached.conversations = user.uid;
      db.ref('userConversations/' + user.uid).on('value', snap => {
        const obj = snap.val() || {};
        const list = Object.keys(obj).map(uid => ({ uid, ...obj[uid] }))
          .sort((a,b) => (b.lastAt||0) - (a.lastAt||0));

        if(!convosInitialized){
          // first load after login: just record where things stand, don't notify for old messages
          list.forEach(c => { lastKnownConvoAt[c.uid] = c.lastAt || 0; });
          convosInitialized = true;
        } else {
          list.forEach(c => {
            const prev = lastKnownConvoAt.hasOwnProperty(c.uid) ? lastKnownConvoAt[c.uid] : 0;
            const isIncoming = c.lastFrom && c.lastFrom !== user.uid;
            const isNew = c.lastAt && c.lastAt > prev;
            const alreadyViewingThisThread = state.modal === 'messages' && state.activeConversationUid === c.uid;
            if(isIncoming && isNew){
              if(alreadyViewingThisThread){
                markConversationRead(c.uid); // seeing it live counts as read
              } else {
                state.banner = '✉️ New message from @' + (c.username || 'someone') + ' — ' + (c.lastMessage || '').slice(0, 60);
              }
            }
            lastKnownConvoAt[c.uid] = c.lastAt || 0;
          });
        }

        state.conversations = list;
        render();
      }, err => {
        state.banner = 'Could not load conversations: ' + err.message;
        render();
      });
    }
    if(!user && listenersAttached.thread && previousUid){
      db.ref('messages/' + convoIdFor(previousUid, listenersAttached.thread)).off();
      listenersAttached.thread = null;
      state.activeMessages = [];
      state.activeConversationUid = null;
    }
    render();
  });

    listenersAttached.publicEssays = true;
    db.ref('publicEssays').on('value', snap => {

  // Builds a speaker icon button wired to any {mute, unmute, isMuted} controller —
  // shared by both native <audio> posts and YouTube-backed posts.
  function soundToggleButton(controller){
    const btn = el('button', {type:'button', class:'sound-toggle-btn'}, iconEl(ICONS.speakerOff));
    function refreshIcon(){
      const muted = controller.isMuted();
      btn.innerHTML = '';
      btn.appendChild(iconEl(muted ? ICONS.speakerOff : ICONS.speakerOn));
      btn.classList.toggle('playing', !muted);
      btn.title = muted ? 'Tap to unmute' : 'Tap to mute';
    }
    btn.addEventListener('click', () => {
      if(controller.isMuted()){
        if(currentlyPlayingAudio && currentlyPlayingAudio !== controller) currentlyPlayingAudio.mute();
        currentlyPlayingAudio = controller;
        controller.unmute();
      } else {
        controller.mute();
        if(currentlyPlayingAudio === controller) currentlyPlayingAudio = null;
      }
      refreshIcon();
    });
    refreshIcon();
    return btn;
  }

  // ---------- YouTube IFrame API readiness ----------
  let ytApiReady = false;
  let ytReadyQueue = [];
  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;

  function whenYtReady(fn){

  function parseYouTubeId(url){
    if(!url) return null;
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function parseTimeToSeconds(str){
    if(!str || !str.trim()) return null;
    const parts = str.trim().split(':').map(s => parseInt(s, 10));
    if(parts.some(isNaN)) return null;
    if(parts.length === 1) return parts[0];
    if(parts.length === 2) return parts[0] * 60 + parts[1];
    if(parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return null;
  }

  function formatSecondsAsTime(sec){
    if(sec === null || sec === undefined) return '';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  // Minimal HTML sanitizer: strips anything outside a small safelist before
  // essay bodies (which are stored as raw editor HTML) are ever injected via innerHTML.
  function sanitizeEssayHtml(html){
    const allowed = new Set(['B','STRONG','I','EM','U','H2','H3','P','BR','UL','OL','LI','A','BLOCKQUOTE','DIV','SPAN']);
    let doc;
    try{ doc = new DOMParser().parseFromString(html || '', 'text/html'); }
    catch(e){ return ''; }
    function clean(node){
      [...node.childNodes].forEach(child => {
        if(child.nodeType === 1){
          if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM'].includes(child.tagName)){
            child.remove();
            return;
          }
          if(!allowed.has(child.tagName)){
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          [...child.attributes].forEach(attr => {
            if(child.tagName === 'A' && attr.name === 'href' && /^https?:\/\//i.test(attr.value)) return;
            child.removeAttribute(attr.name);
          });
          clean(child);
        } else if(child.nodeType === 8){
          child.remove();
        }
      });
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  function plainTextFromHtml(html){
    const div = document.createElement('div');
    div.innerHTML = sanitizeEssayHtml(html);
    return div.textContent || '';
  }

  // Find an essay (visible to the current viewer) that links to a given post — for the
  // reverse "this post illustrates an essay" indicator shown on PostCard.
  function findEssayLinkedToPost(postId){
    const pool = [...state.publicEssays, ...(state.user ? state.privateEssays.map(e => ({...e, private:true})) : [])];
    return pool.find(e => e.linkedPostId === postId) || null;
  }

  function saveEssayDoc(existingEssay, { title, bodyHtml, bibliography, linkedPostId, visibility, bodyFont }){
    const uid = state.user.uid;
    const payload = {
      title, bodyHtml,
      bibliography: bibliography || [],
      linkedPostId: linkedPostId || null,
      bodyFont: bodyFont || 'lora',
      visibility,
      ownerUid: uid,
      authorName: currentAuthorName(),
      createdAt: existingEssay ? existingEssay.createdAt : firebase.database.ServerValue.TIMESTAMP,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
    };
    function pathFor(v, essayId){
      if(v === 'private') return 'privateEssays/' + uid + (essayId ? '/' + essayId : '');
      if(v === 'followers') return 'followersEssays/' + uid + (essayId ? '/' + essayId : '');
      return 'publicEssays' + (essayId ? '/' + essayId : '');
    }
    if(!existingEssay){
      const base = pathFor(visibility);
      const key = db.ref(base).push().key;
      return db.ref(base + '/' + key).set(payload).then(() => ({ ...payload, id: key, visibility }));
    }
    const oldVisibility = getVisibility(existingEssay);
    const oldPath = essayPath(existingEssay);
    if(oldVisibility === visibility){
      return db.ref(oldPath).update(payload).then(() => ({ ...existingEssay, ...payload, visibility }));
    }
    const newPath = pathFor(visibility, existingEssay.id);
    const updates = {};
    updates[oldPath] = null;
    updates[newPath] = payload;
    return db.ref().update(updates).then(() => ({ ...existingEssay, ...payload, visibility }));
  }

  function EssayPage(){
    if(state.page.type === 'edit') return EssayEditor(state.page.essay, state.page.draft);
    return EssayReader(state.page.essay);

  function EssayEditor(existingEssay, draft){
    const page = el('div', {class:'doc-page'});
    const draftId = draft ? draft.id : (existingEssay ? 'edit-' + existingEssay.id : newDraftId());
    const src = draft || existingEssay || {};
    let visibility = draft ? (draft.visibility || 'public') : (existingEssay ? getVisibility(existingEssay) : 'public');
    let linkedPostId = src.linkedPostId || null;
    let bibliography = src.bibliography ? src.bibliography.map(b => ({...b})) : [];
    let bodyFont = src.bodyFont || 'lora';
    let saving = false;
    let autosaveTimer = null;

    function hasMeaningfulContent(){
      return !!(titleInput.value.trim() || plainTextFromHtml(bodyEl.innerHTML).trim());
    }

    function snapshotForDraft(){
      return {
        type: 'essay',
        title: titleInput.value.trim(),
        bodyHtml: sanitizeEssayHtml(bodyEl.innerHTML),
        bibliography: bibliography.filter(r => (r.label && r.label.trim()) || (r.url && r.url.trim())),
        linkedPostId, bodyFont, visibility,
        originalEssayId: existingEssay ? existingEssay.id : null,
      };
    }

    function stopAutosave(){
      if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; }
      window.removeEventListener('beforeunload', beforeUnloadHandler);
    }

    function beforeUnloadHandler(e){
      if(hasMeaningfulContent()){ e.preventDefault(); e.returnValue = ''; }
    }
    window.addEventListener('beforeunload', beforeUnloadHandler);

    // top bar
    const topbar = el('div', {class:'doc-topbar'});
    const left = el('div', {class:'doc-topbar-left'});
    left.appendChild(el('button', {class:'icon-btn', title:'Back', onClick: () => {
      if(hasMeaningfulContent()) saveDraft(draftId, snapshotForDraft());
      stopAutosave();
      closeEssayPage();
    }}, iconEl(ICONS.back)));

    left.appendChild(visibilitySelector(() => visibility, (v) => { visibility = v; }));
    topbar.appendChild(left);

    const saveBtn = el('button', {class:'pill-btn', onClick: onSave}, existingEssay ? 'Save changes' : 'Publish');
    topbar.appendChild(saveBtn);
    page.appendChild(topbar);

    // formatting toolbar
    const toolbar = el('div', {class:'doc-toolbar'});
    function toolBtn(label, cmd, arg){
      return el('button', {
        class:'doc-tool-btn', type:'button',
        onMousedown: (e) => e.preventDefault(), // keep focus/selection in the editable area
        onClick: () => { bodyEl.focus(); document.execCommand(cmd, false, arg || null); },
      }, label);
    }
    toolbar.appendChild(toolBtn('B', 'bold'));
    toolbar.appendChild(toolBtn('I', 'italic'));
    toolbar.appendChild(toolBtn('U', 'underline'));
    toolbar.appendChild(toolBtn('H2', 'formatBlock', 'H2'));
    toolbar.appendChild(toolBtn('H3', 'formatBlock', 'H3'));
    toolbar.appendChild(toolBtn('“ ”', 'formatBlock', 'BLOCKQUOTE'));
    toolbar.appendChild(toolBtn('• List', 'insertUnorderedList'));
    toolbar.appendChild(toolBtn('1. List', 'insertOrderedList'));
    toolbar.appendChild(el('button', {
      class:'doc-tool-btn', type:'button',
      onMousedown: (e) => e.preventDefault(),
      onClick: () => {
        const url = prompt('Link URL (https://…)');
        if(url && /^https?:\/\//i.test(url)){ bodyEl.focus(); document.execCommand('createLink', false, url); }
      },
    }, 'Link'));
    toolbar.appendChild(toolBtn('Clear', 'removeFormat'));

    const fontSelect = el('select', {class:'doc-tool-btn', title:'Body font'});
    FONT_OPTIONS.forEach(f => {
      const opt = el('option', {value: f.id}, f.label);
      opt.style.fontFamily = f.family;
      if(f.id === bodyFont) opt.selected = true;
      fontSelect.appendChild(opt);
    });
    fontSelect.addEventListener('change', () => {
      bodyFont = fontSelect.value;
      bodyEl.style.fontFamily = fontFamilyFor(bodyFont);
    });
    toolbar.appendChild(fontSelect);
    page.appendChild(toolbar);

    // body
    const wrap = el('div', {class:'doc-body-wrap'});
    const titleInput = el('input', {
      class:'doc-title-input', type:'text', placeholder:'Untitled essay',
      value: src.title || '',
    });
    wrap.appendChild(titleInput);

    const bodyEl = el('div', {
      class:'doc-editable', contenteditable:'true', 'data-placeholder':'Start writing…',
      style: 'font-family: ' + fontFamilyFor(bodyFont) + ';',
    });
    if(src.bodyHtml){
      bodyEl.innerHTML = sanitizeEssayHtml(src.bodyHtml);
    } else if(existingEssay && existingEssay.body){
      bodyEl.innerHTML = '<p>' + existingEssay.body.replace(/</g, '&lt;') + '</p>';
    }
    wrap.appendChild(bodyEl);

    if(draft){
      wrap.insertBefore(el('div', {class:'essay-meta', style:'margin-bottom:14px; color:var(--private);'},
        'Resumed from an unsaved draft (' + fmtDate(draft.updatedAt) + ').'
      ), titleInput);
    }

    // bibliography
    wrap.appendChild(el('div', {class:'doc-section-heading'}, 'REFERENCES'));
    const bibList = el('div', {});
    function renderBibRows(){
      bibList.innerHTML = '';
      bibliography.forEach((ref, i) => {
        const row = el('div', {class:'doc-bib-row'});
        const labelInput = el('input', {type:'text', placeholder:'Title / author', value: ref.label || ''});
        const urlInput = el('input', {type:'url', placeholder:'https:// (optional)', value: ref.url || ''});
        labelInput.addEventListener('input', (e) => { bibliography[i].label = e.target.value; });
        urlInput.addEventListener('input', (e) => { bibliography[i].url = e.target.value; });
        const removeBtn = el('button', {class:'delete-btn', style:'margin-left:0;', title:'Remove', onClick: () => {
          bibliography.splice(i, 1);
          renderBibRows();
        }}, iconEl(ICONS.trash));
        row.appendChild(labelInput);
        row.appendChild(urlInput);
        row.appendChild(removeBtn);
        bibList.appendChild(row);
      });
    }
    renderBibRows();
    wrap.appendChild(bibList);
    wrap.appendChild(el('button', {class:'inline-link', style:'margin-top:4px;', onClick: () => {
      bibliography.push({ label:'', url:'' });
      renderBibRows();
    }}, '+ Add reference'));

    // link to a social post
    wrap.appendChild(el('div', {class:'doc-section-heading'}, 'LINK A SOCIAL POST — the aesthetic depiction of this essay'));
    const myPosts = allVisiblePosts().filter(p => state.user && p.ownerUid === state.user.uid);
    const picker = el('div', {class:'doc-post-picker'});
    function renderPicker(){
      picker.innerHTML = '';
      const none = el('div', {class:'doc-none-tile' + (!linkedPostId ? ' selected' : ''), onClick: () => { linkedPostId = null; renderPicker(); }}, 'None');
      picker.appendChild(none);
      myPosts.forEach(p => {
        const tile = el('div', {class:'doc-post-tile' + (linkedPostId === p.id ? ' selected' : ''), onClick: () => { linkedPostId = p.id; renderPicker(); }});
        const thumb = postImages(p)[0];
        if(thumb) tile.appendChild(el('img', {src:thumb, alt:'post'}));
        tile.appendChild(el('div', {class:'doc-post-tile-caption'}, p.caption || ''));
        picker.appendChild(tile);
      });
      if(myPosts.length === 0){
        picker.appendChild(el('div', {class:'essay-meta'}, 'You don\'t have any social posts yet.'));
      }
    }
    renderPicker();
    wrap.appendChild(picker);

    page.appendChild(wrap);

    autosaveTimer = setInterval(() => {
      if(hasMeaningfulContent()) saveDraft(draftId, snapshotForDraft());
    }, 20000);

    function onSave(){
      const title = titleInput.value.trim();
      const bodyHtml = sanitizeEssayHtml(bodyEl.innerHTML);
      const bodyText = plainTextFromHtml(bodyHtml);
      if(!title || !bodyText.trim()){
        alert('Please add a title and some body text before publishing.');
        return;
      }
      if(saving) return;
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const cleanBib = bibliography.filter(r => (r.label && r.label.trim()) || (r.url && r.url.trim()));
      saveEssayDoc(existingEssay, { title, bodyHtml, bibliography: cleanBib, linkedPostId, visibility, bodyFont })
        .then(saved => {
          stopAutosave();
          deleteDraftEntry(draftId);
          openEssayView(saved);
        })
        .catch(err => {
          saving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = existingEssay ? 'Save changes' : 'Publish';
          alert('Could not save: ' + err.message);
        });
    }

    return page;
  }

        ));

      }
    }
    const likedByMe = !!(post.likes && state.user && post.likes[state.user.uid]);
    const likeCount = post.likes ? Object.keys(post.likes).length : 0;
    const actions = el('div', {class:'post-actions'},
      el('button', {class:'heart-btn', onClick: () => toggleLike(post)}, iconEl(ICONS.heart(likedByMe))),
      el('span', {class:'like-count'}, likeCount > 0 ? String(likeCount) : ''),
    );
    if(isOwner){

      }, iconEl(ICONS.trash)));
    } else if(isAdmin()){
      actions.appendChild(el('button', {
        class:'delete-btn', style:'margin-left:auto;', title:'Delete post (admin)',
        onClick: () => deletePost(post)
      }, iconEl(ICONS.trash)));
    }
    card.appendChild(actions);
    card.appendChild(el('div', {class:'post-caption'}, post.caption));

    if(post.audioUrl){
      const audioWrap = el('div', {class:'post-audio-wrap'});
      if(post.audioTitle){
        audioWrap.appendChild(el('div', {class:'post-audio-title'}, '♪ ' + post.audioTitle));
      }
      const audioEl = el('audio', {
        src: post.audioUrl, loop:'loop', muted:'muted', playsinline:'playsinline',
        style:'display:none;',
      });
      audioEl.muted = true;
      audioEl.onerror = () => { audioWrap.style.display = 'none'; };

      const controller = {
        mute: () => { audioEl.muted = true; },
        unmute: () => { audioEl.muted = false; audioEl.play().catch(() => {}); },
        isMuted: () => audioEl.muted,
        play: () => audioEl.play().catch(() => {}),
        pause: () => audioEl.pause(),
      };
      const soundBtn = soundToggleButton(controller);

      audioWrap.appendChild(audioEl);
      audioWrap.appendChild(soundBtn);
      card.appendChild(audioWrap);

      if('IntersectionObserver' in window){
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => { entry.isIntersecting ? controller.play() : controller.pause(); });
        }, { threshold: 0.6 });
        observer.observe(card);
      }
    } else if(post.youtubeId){
      const audioWrap = el('div', {class:'post-audio-wrap'});
      if(post.audioTitle){
        audioWrap.appendChild(el('div', {class:'post-audio-title'}, '♪ ' + post.audioTitle));
      }
      const ytMount = el('div', {style:'position:absolute; left:-9999px; width:2px; height:2px;'});
      card.appendChild(ytMount);

      let ytPlayer = null;
      let loopTimer = null;
      let pendingPlay = false; // becomes true if scrolled into view before the player is ready
      const start = post.youtubeStart || 0;
      const end = post.youtubeEnd || null;

      const controller = {
        mute: () => { if(ytPlayer && ytPlayer.mute) ytPlayer.mute(); },
        unmute: () => {
          if(ytPlayer && ytPlayer.unMute){ ytPlayer.unMute(); ytPlayer.playVideo(); }
        },
        isMuted: () => !ytPlayer || !ytPlayer.isMuted || ytPlayer.isMuted(),
        play: () => { if(ytPlayer) ytPlayer.playVideo(); else pendingPlay = true; },
        pause: () => { if(ytPlayer) ytPlayer.pauseVideo(); pendingPlay = false; },
      };
      const soundBtn = soundToggleButton(controller);
      audioWrap.appendChild(soundBtn);
      card.appendChild(audioWrap);

      whenYtReady(() => {
        ytPlayer = new YT.Player(ytMount, {
          videoId: post.youtubeId,
          playerVars: { start, controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1 },
          events: {
            onReady: (e) => {
              e.target.mute();
              if(pendingPlay) e.target.playVideo();
              loopTimer = setInterval(() => {
                if(!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
                if(end && ytPlayer.getCurrentTime() >= end) ytPlayer.seekTo(start, true);
              }, 300);
            },
            onStateChange: (e) => {
              if(e.data === YT.PlayerState.ENDED) e.target.seekTo(start, true) && e.target.playVideo();
            },
          },
        });
      });

      if('IntersectionObserver' in window){
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => { entry.isIntersecting ? controller.play() : controller.pause(); });
        }, { threshold: 0.6 });
        observer.observe(card);
      }
    }

    const timeRow = el('div', {class:'post-time'});
    timeRow.appendChild(AuthorLine(post.authorName, post.ownerUid));
    timeRow.appendChild(document.createTextNode(' · ' + fmtDate(post.createdAt)));
    card.appendChild(timeRow);

    const linkedEssay = findEssayLinkedToPost(post.id);
    if(linkedEssay){
      card.appendChild(el('div', {class:'post-time', style:'margin-top:4px;'},
        '📖 ',
        el('button', {class:'inline-link', onClick: () => openEssayView(linkedEssay)}, 'Read the essay: ' + linkedEssay.title),
      ));
    }
    return card;
  }

  function deletePost(post){

    db.ref(postPath(post)).remove().then(() => {
      postImages(post).forEach(url => {
        if(url && url.includes('firebasestorage')){
          storage.refFromURL(url).delete().catch(() => {});
        }
      });
      if(post.audioUrl && post.audioUrl.includes('firebasestorage')){
        storage.refFromURL(post.audioUrl).delete().catch(() => {});
      }
    }).catch(err => {
      state.banner = 'Could not delete: ' + err.message;
      render();
    });
  }

  function toggleLike(post){
    if(!state.user){

    }
    const ref = db.ref(postPath(post) + '/likes/' + state.user.uid);

  function savePostVisibility(post, { caption, visibility }){
    const oldVisibility = getVisibility(post);
    const oldPath = postPath(post);
    if(oldVisibility === visibility){
      return db.ref(oldPath).update({ caption }).then(() => ({ ...post, caption }));
    }
    const basePayload = { ...post, caption, visibility };
    delete basePayload.id;
    delete basePayload.private;
    function pathFor(v){
      if(v === 'private') return 'privatePosts/' + post.ownerUid + '/' + post.id;
      if(v === 'followers') return 'followersPosts/' + post.ownerUid + '/' + post.id;
      return 'posts/' + post.id;
    }
    const newPath = pathFor(visibility);
    const updates = {};
    updates[oldPath] = null;
    updates[newPath] = basePayload;
    return db.ref().update(updates).then(() => ({ ...post, caption, visibility }));
  }

  // ---------- people (find & follow) modal ----------
  function PeopleModal(){
    const overlay = el('div', {class:'overlay', onClick: (e) => { if(e.target === overlay) closeModal(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, 'Find People'));

    const searchRow = el('div', {style:'display:flex; gap:8px; align-items:flex-start;'});
    const queryInput = el('input', {type:'text', placeholder:'search username', style:'flex:1;'});
    const searchBtn = el('button', {class:'btn-primary', style:'flex:0 0 auto; padding:10px 16px;', onClick: doSearch}, 'Search');
    searchRow.appendChild(queryInput);
    searchRow.appendChild(searchBtn);
    modal.appendChild(searchRow);

    queryInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); doSearch(); } });

    const resultsWrap = el('div', {style:'margin-top:18px; max-height:320px; overflow-y:auto;'});
    modal.appendChild(resultsWrap);

    function renderResults(){
      resultsWrap.innerHTML = '';
      if(!state.peopleSearched){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'Search for a username to follow or message.'));
        return;
      }
      if(state.peopleResults.length === 0){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No one found.'));
        return;
      }
      state.peopleResults.forEach(person => {
        if(state.user && person.uid === state.user.uid) return;
        const row = el('div', {style:'display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline);'});
        row.appendChild(el('span', {}, '@' + person.username));
        const btnGroup = el('div', {style:'display:flex; gap:14px;'});
        const following = isFollowing(person.uid);
        btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => { following ? unfollowUser(person.uid) : followUser(person.uid); }}, following ? 'Following' : 'Follow'));
        btnGroup.appendChild(el('button', {class:'inline-link', onClick: () => openConversation(person.uid, person.username)}, 'Message'));
        row.appendChild(btnGroup);
        resultsWrap.appendChild(row);
      });
      if(resultsWrap.children.length === 0){
        resultsWrap.appendChild(el('div', {class:'essay-meta', style:'text-align:center;'}, 'No one found.'));
      }
    }

    async function doSearch(){
      const prefix = queryInput.value.trim().toLowerCase();
      if(!prefix) return;
      searchBtn.disabled = true;
      searchBtn.textContent = '…';
      try{
        const snap = await db.ref('usernameIndex')
          .orderByKey().startAt(prefix).endAt(prefix + '\uf8ff').limitToFirst(25).once('value');
        const obj = snap.val() || {};
        state.peopleResults = Object.keys(obj).map(username => ({ username, uid: obj[username] }));
        state.peopleSearched = true;
      } catch(err){
        state.banner = 'Search failed: ' + err.message;
      }
      searchBtn.disabled = false;
      searchBtn.textContent = 'Search';
      renderResults();
    }

    renderResults();

    const actions = el('div', {class:'modal-actions', style:'margin-top:18px;'});
    actions.appendChild(el('button', {class:'btn-secondary', onClick: closeModal}, 'Close'));
    modal.appendChild(actions);

    overlay.appendChild(modal);
    return overlay;
  }

    const cancelBtn = el('button', {class:'btn-secondary', onClick: () => { state.editingPost = null; closeModal(); }}, 'Cancel');
    const saveBtn = el('button', {class:'btn-primary', onClick: () => {
      const caption = capInput.value.trim();
      if(!caption){
        if(!errorEl){ errorEl = el('div', {class:'field-error'}, 'Caption is required.'); modal.insertBefore(errorEl, actions); }
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      savePostVisibility(post, { caption, visibility })
        .then(() => { state.editingPost = null; closeModal(); })
        .catch(err => {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';

  // ---------- drafts modal ----------

  function resumeDraft(draft){
    state.modal = null;
    if(draft.type === 'essay'){
      const original = draft.originalEssayId
        ? allVisibleEssays().find(e => e.id === draft.originalEssayId)
        : null;
      openEssayEdit(original || null, draft);
    } else {
      state.resumePostDraft = draft;
      state.modal = 'compose';
      state.composeTab = 'social';
    }
    render();
  }

    const modal = el('div', {class:'modal'});

          const row = el('div', {
            style:'padding:12px 0; border-bottom:1px solid var(--hairline); cursor:pointer; display:flex; align-items:flex-start; gap:8px;',

    const picker = el('div', {class:'image-picker'}, pickerBtn, pickerStatus, fileInput);

    const gridSlot = el('div', {style:'display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;'});
    form.appendChild(gridSlot);
    form.appendChild(el('div', {class:'essay-meta', style:'margin-top:6px;'}, 'Previews show exactly how each photo will be cropped in the feed.'));

    function renderGrid(){
      gridSlot.innerHTML = '';
      pickerStatus.textContent = images.length === 0 ? 'No photos chosen' : images.length + ' image' + (images.length === 1 ? '' : 's') + ' added';
      images.forEach(entry => {
        const src = entry.type === 'file' ? entry.previewUrl : entry.url;

          images = images.filter(i => i.id !== entry.id);
          renderGrid();
        }}, '×'));
        gridSlot.appendChild(wrap);
      });

    renderGrid();

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files || []);
      fileInput.value = '';
      for(const file of files){
        if(images.length >= MAX_IMAGES){
          pickerStatus.textContent = 'Max ' + MAX_IMAGES + ' images per post';
          break;
        }
        if(!file.type.startsWith('image/')) continue;
        if(file.size > 8 * 1024 * 1024) continue;
        images.push({ id: nextId++, type:'file', file, previewUrl: URL.createObjectURL(file) });
      }
      renderGrid();
    });

    form.appendChild(el('div', {class:'or-divider'}, '— OR ADD BY URL —'));
    const urlRow = el('div', {style:'display:flex; gap:8px;'});
    const urlInput = el('input', {type:'url', placeholder:'https://…', style:'flex:1;'});
    const urlAddBtn = el('button', {type:'button', class:'image-picker-btn', onClick: (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if(!url) return;
      if(images.length >= MAX_IMAGES){ pickerStatus.textContent = 'Max ' + MAX_IMAGES + ' images per post'; return; }
      images.push({ id: nextId++, type:'url', url });
      urlInput.value = '';
      renderGrid();
    }}, 'Add');
    urlRow.appendChild(urlInput);
    urlRow.appendChild(urlAddBtn);
    form.appendChild(urlRow);

    // ---- music (optional, one track) ----
    form.appendChild(el('div', {class:'doc-section-heading', style:'margin:24px 0 10px;'}, 'MUSIC (optional)'));
    let audioEntry = draft && draft.audioUrl ? { type:'url', url: draft.audioUrl } : null; // { type:'file', file } | { type:'url', url }
    let youtubeId = (draft && draft.youtubeId) || null;
    let youtubeStart = (draft && draft.youtubeStart) || 0;
    let youtubeEnd = (draft && draft.youtubeEnd) || null;
    let musicSource = youtubeId ? 'youtube' : 'upload'; // 'upload' | 'youtube' — mutually exclusive

    const musicTabs = el('div', {class:'tab-row'});
    const uploadTabBtn = el('button', {class:'tab-btn' + (musicSource === 'upload' ? ' active' : ''), onClick: () => { musicSource = 'upload'; youtubeId = null; renderMusicSource(); }}, 'UPLOAD / LINK');
    const youtubeTabBtn = el('button', {class:'tab-btn' + (musicSource === 'youtube' ? ' active' : ''), onClick: () => { musicSource = 'youtube'; audioEntry = null; renderMusicSource(); }}, 'YOUTUBE');
    musicTabs.appendChild(uploadTabBtn);
    musicTabs.appendChild(youtubeTabBtn);
    form.appendChild(musicTabs);

    const musicSourceSlot = el('div', {style:'margin-top:12px;'});
    form.appendChild(musicSourceSlot);

    // ---- upload / direct link sub-panel ----
    const audioFileInput = el('input', {type:'file', accept:'audio/*'});
    const audioStatus = el('span', {class:'image-picker-status'}, audioEntry ? 'Linked track' : 'No track chosen');
    const audioPickBtn = el('button', {type:'button', class:'image-picker-btn', onClick: (e) => { e.preventDefault(); audioFileInput.click(); }}, 'Choose Audio');
    const audioPicker = el('div', {class:'image-picker'}, audioPickBtn, audioStatus, audioFileInput);
    const audioPreviewSlot = el('div', {style:'margin-top:10px;'});

    function renderAudioPreview(){
      audioPreviewSlot.innerHTML = '';
      if(!audioEntry) return;
      const src = audioEntry.type === 'file' ? URL.createObjectURL(audioEntry.file) : audioEntry.url;
      const row = el('div', {style:'display:flex; align-items:center; gap:10px;'});
      const audioEl = el('audio', {controls:'controls', src, style:'flex:1; height:32px;'});
      row.appendChild(audioEl);
      row.appendChild(el('button', {type:'button', class:'delete-btn', style:'margin-left:0;', title:'Remove track', onClick: () => {
        audioEntry = null;
        audioFileInput.value = '';
        audioTrackTitleInput.value = '';
        audioStatus.textContent = 'No track chosen';
        renderAudioPreview();
      }}, iconEl(ICONS.trash)));
      audioPreviewSlot.appendChild(row);
    }

    audioFileInput.addEventListener('change', () => {
      const file = audioFileInput.files && audioFileInput.files[0];
      if(!file) return;
      if(!file.type.startsWith('audio/')){ audioStatus.textContent = 'Please choose an audio file'; return; }
      if(file.size > 15 * 1024 * 1024){ audioStatus.textContent = 'Audio too large (max 15MB)'; return; }
      audioEntry = { type:'file', file };
      audioStatus.textContent = file.name;
      if(!audioTrackTitleInput.value.trim()) audioTrackTitleInput.value = file.name.replace(/\.[^.]+$/, '');
      renderAudioPreview();
    });

    const audioUrlRow = el('div', {style:'display:flex; gap:8px; margin-top:8px;'});
    const audioUrlInput = el('input', {type:'url', placeholder:'https://… (link to an audio file)', style:'flex:1;'});
    const audioUrlAddBtn = el('button', {type:'button', class:'image-picker-btn', onClick: (e) => {
      e.preventDefault();
      const url = audioUrlInput.value.trim();
      if(!url) return;
      audioEntry = { type:'url', url };
      audioUrlInput.value = '';
      audioStatus.textContent = 'Linked track';
      renderAudioPreview();
    }}, 'Add');
    audioUrlRow.appendChild(audioUrlInput);
    audioUrlRow.appendChild(audioUrlAddBtn);

    // ---- YouTube sub-panel ----
    const ytUrlRow = el('div', {style:'display:flex; gap:8px;'});
    const ytUrlInput = el('input', {type:'url', placeholder:'Paste a YouTube link…', style:'flex:1;'});
    const ytLoadBtn = el('button', {type:'button', class:'image-picker-btn', onClick: (e) => {
      e.preventDefault();
      const id = parseYouTubeId(ytUrlInput.value.trim());
      if(!id){ ytStatus.textContent = 'Could not read a video from that link'; return; }
      youtubeId = id;
      youtubeStart = 0;
      youtubeEnd = null;
      startInput.value = '0:00';
      endInput.value = '';
      renderYtPreview();
    }}, 'Load');
    ytUrlRow.appendChild(ytUrlInput);
    ytUrlRow.appendChild(ytLoadBtn);

    const ytStatus = el('div', {class:'essay-meta', style:'margin-top:6px;'}, '');
    const ytPreviewSlot = el('div', {style:'margin-top:10px;'});

    const timeRow = el('div', {style:'display:flex; gap:10px; margin-top:12px;'});
    const startInput = el('input', {type:'text', placeholder:'Start (m:ss)', style:'flex:1;', value: youtubeStart ? formatSecondsAsTime(youtubeStart) : ''});
    const endInput = el('input', {type:'text', placeholder:'End (m:ss, optional)', style:'flex:1;', value: youtubeEnd ? formatSecondsAsTime(youtubeEnd) : ''});
    startInput.addEventListener('input', () => { youtubeStart = parseTimeToSeconds(startInput.value) || 0; });
    endInput.addEventListener('input', () => { youtubeEnd = parseTimeToSeconds(endInput.value); });
    timeRow.appendChild(startInput);
    timeRow.appendChild(endInput);

    function renderYtPreview(){
      ytPreviewSlot.innerHTML = '';
      ytStatus.textContent = '';
      if(!youtubeId) return;
      const row = el('div', {style:'display:flex; gap:10px; align-items:center;'});
      row.appendChild(el('img', {src: 'https://img.youtube.com/vi/' + youtubeId + '/mqdefault.jpg', alt:'video thumbnail', style:'width:100px; height:56px; object-fit:cover; border:1px solid var(--hairline);'}));
      row.appendChild(el('button', {type:'button', class:'delete-btn', style:'margin-left:0;', title:'Remove', onClick: () => {
        youtubeId = null;
        ytUrlInput.value = '';
        renderYtPreview();
      }}, iconEl(ICONS.trash)));
      ytPreviewSlot.appendChild(row);
      fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + youtubeId + '&format=json')
        .then(r => r.ok ? r.json() : null)
        .then(data => { if(data && data.title){ ytStatus.textContent = data.title; if(!audioTrackTitleInput.value.trim()) audioTrackTitleInput.value = data.title; } })
        .catch(() => {});
    }

    function renderMusicSource(){
      uploadTabBtn.classList.toggle('active', musicSource === 'upload');
      youtubeTabBtn.classList.toggle('active', musicSource === 'youtube');
      musicSourceSlot.innerHTML = '';
      if(musicSource === 'upload'){
        musicSourceSlot.appendChild(audioPicker);

        renderAudioPreview();

        musicSourceSlot.appendChild(ytStatus);
        musicSourceSlot.appendChild(ytPreviewSlot);
        musicSourceSlot.appendChild(el('div', {class:'essay-meta', style:'margin-top:10px;'}, 'Pick a section to loop — leave End blank to loop the whole video.'));
        musicSourceSlot.appendChild(timeRow);
        renderYtPreview();
      }

    renderMusicSource();

    const audioTrackTitleInput = el('input', {type:'text', placeholder:'Track title (optional)', style:'margin-top:8px;'});
    audioTrackTitleInput.value = (draft && draft.audioTitle) || '';
    form.appendChild(audioTrackTitleInput);

    const capLabel = el('label', {class:'field-label'}, 'CAPTION');
    const capInput = el('textarea', {placeholder:'Say something nerdy…', style:'min-height:70px;'});
    capInput.value = (draft && draft.caption) || '';
    form.appendChild(capLabel);
    form.appendChild(capInput);

    const progressWrap = el('div', {class:'upload-progress', style:'display:none;'});
    const progressBar = el('div', {class:'upload-progress-bar'});
    progressWrap.appendChild(progressBar);
    form.appendChild(progressWrap);

    const note = el('div', {class:'essay-meta', style:'margin-top:14px;'}, 'Photos picked from your device won\'t survive a draft save — only URLs, audio links, and text will.');
    form.appendChild(note);

    function hasMeaningfulPostContent(){
      return !!(capInput.value.trim() || images.some(i => i.type === 'url') || (audioEntry && audioEntry.type === 'url') || youtubeId);
    }

    function snapshotPostDraft(){
      return {
        type: 'post',
        caption: capInput.value.trim(),
        imageUrls: images.filter(i => i.type === 'url').map(i => i.url),
        audioUrl: audioEntry && audioEntry.type === 'url' ? audioEntry.url : null,
        audioTitle: audioTrackTitleInput.value.trim(),
        youtubeId, youtubeStart, youtubeEnd,
        visibility,
      };
    }

    saveDraftTimer = setInterval(() => {
      if(hasMeaningfulPostContent()) saveDraft(draftId, snapshotPostDraft());
    }, 15000);

    function beforeUnloadHandlerPost(e){
      if(hasMeaningfulPostContent()){ e.preventDefault(); e.returnValue = ''; }
    }
    window.addEventListener('beforeunload', beforeUnloadHandlerPost);

    function stopPostAutosave(){
      if(saveDraftTimer){ clearInterval(saveDraftTimer); saveDraftTimer = null; }
      window.removeEventListener('beforeunload', beforeUnloadHandlerPost);
    }

    const actions = el('div', {class:'modal-actions'});
    const cancelBtn = el('button', {class:'btn-secondary', onClick: () => {
      if(hasMeaningfulPostContent()) saveDraft(draftId, snapshotPostDraft());
      stopPostAutosave();
      closeModal();
    }}, 'Cancel');
    const saveBtn = el('button', {class:'btn-primary', onClick: async () => {
      const caption = capInput.value.trim();
      if(!caption){
        if(!errorEl){
          errorEl = el('div', {class:'field-error'}, 'Caption is required.');
          form.appendChild(errorEl);
        }
        return;
      }
      saveBtn.disabled = true;
      cancelBtn.disabled = true;
      const uid = state.user.uid;

      try{
        const fileEntries = images.map(i => ({ ...i, role: 'image' }))
          .filter(i => i.type === 'file');
        if(audioEntry && audioEntry.type === 'file'){
          fileEntries.push({ id: 'audio', role: 'audio', type: 'file', file: audioEntry.file });
        }
        const progressByEntry = {};

        if(fileEntries.length > 0){
          saveBtn.textContent = 'Uploading…';
          progressWrap.style.display = 'block';
        }

        function updateAggregateProgress(){
          let transferred = 0, total = 0;
          fileEntries.forEach(e => {
            const p = progressByEntry[e.id];
            if(p){ transferred += p.transferred; total += p.total; }
          });
          if(total > 0) progressBar.style.width = Math.round((transferred / total) * 100) + '%';
        }

        const uploadResults = await Promise.all(fileEntries.map(entry => {
          const safeName = (entry.file.name || (entry.role === 'audio' ? 'track' : 'photo')).replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = 'posts/' + uid + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '_' + safeName;
          const uploadTask = storage.ref(path).put(entry.file);
          return new Promise((resolve, reject) => {
            uploadTask.on('state_changed', snap => {
              progressByEntry[entry.id] = { transferred: snap.bytesTransferred, total: snap.totalBytes };
              updateAggregateProgress();
            }, reject, async () => {
              try{ resolve({ id: entry.id, url: await uploadTask.snapshot.ref.getDownloadURL() }); }
              catch(e){ reject(e); }
            });
          });
        }));
        const urlByEntryId = {};
        uploadResults.forEach(r => { urlByEntryId[r.id] = r.url; });

        const orderedImageUrls = images.map(entry => entry.type === 'file' ? urlByEntryId[entry.id] : entry.url).filter(Boolean);
        const audioUrl = audioEntry ? (audioEntry.type === 'file' ? urlByEntryId['audio'] : audioEntry.url) : null;
        const audioTitle = audioTrackTitleInput.value.trim();

        saveBtn.textContent = 'Posting…';
        const basePath = visibility === 'private' ? 'privatePosts/' + uid
          : visibility === 'followers' ? 'followersPosts/' + uid
          : 'posts';
        const newRef = db.ref(basePath).push();
        await newRef.set({
          images: orderedImageUrls,
          image: orderedImageUrls[0] || '', // kept for backward compatibility with older code paths
          caption,
          audioUrl: audioUrl || null,
          audioTitle: (audioUrl || youtubeId) ? (audioTitle || null) : null,
          youtubeId: youtubeId || null,
          youtubeStart: youtubeId ? (youtubeStart || 0) : null,
          youtubeEnd: youtubeId ? (youtubeEnd || null) : null,
          visibility,
          ownerUid: uid,
          authorName: currentAuthorName(),
          likes: {},
          createdAt: firebase.database.ServerValue.TIMESTAMP,
        });
        stopPostAutosave();
        deleteDraftEntry(draftId);
        closeModal();
      } catch(err){
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = 'Share post';
        progressWrap.style.display = 'none';
        if(!errorEl){
          errorEl = el('div', {class:'field-error'});
          form.appendChild(errorEl);
        }
        errorEl.textContent = 'Could not post: ' + err.message;
      }
    }}, 'Share post');
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    form.appendChild(actions);

    return form;
  }

  render();
})();
</script>
</body>
</html>
