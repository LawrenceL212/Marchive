<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marchives</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e7e4dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e7e4dc;
    --paper-raised: #edeae2;
    --ink: #1b1a17;
    --ink-soft: #3a382f;
    --muted: #78745f;
    --line: #1b1a17;
    --hairline: rgba(27,26,23,0.14);
    --private: #6b2b3a;
    --private-soft: #6b2b3a1a;
    --public: #45573f;
    --public-soft: #45573f1a;
    --paper-shadow: rgba(27,26,23,0.08);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.02) 0, transparent 40%);
  }

  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 28px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-align:center;
    color: var(--ink);
    grid-column: 2;
    white-space: nowrap;
  }

  header{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    column-gap: 14px;
    padding: 28px 24px 22px;
  }

  .header-right{
    grid-column: 3;
    justify-self: end;
    display:flex;
    align-items:center;
    gap: 18px;
    min-width: 0;
  }

  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--ink);
    padding:4px;
    display:flex;
    align-items:center;
    position: relative;
  }

  .icon-badge{
    position: absolute;
    top: -2px;
    right: -4px;
    min-width: 14px;
    height: 14px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--private);
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    line-height: 14px;
    text-align: center;
  }

  .text-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    background:none;
    border:none;
    color: var(--ink);
    cursor:pointer;
    padding:0;
  }

  .pill-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:500;
    letter-spacing: 0.12em;
    border: 1.4px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 22px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pill-btn:hover{ background: var(--ink); color: var(--paper); }

  .rule{
    height:1px;
    background: var(--line);
    margin: 0 28px;
  }

  .status-line{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 34px 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-align:right;
    min-height: 18px;
  }
  .status-line button{
    font-family:inherit; font-size:inherit; color: var(--private);
    background:none; border:none; cursor:pointer; letter-spacing:0.04em;
    text-decoration: underline;
  }

  main{
    display:grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1180px;
    margin: 0 auto;
    min-height: 70vh;
  }

  .divider{ background: var(--line); }

  .col{ padding: 30px 40px 60px; }

  .col-heading{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight:500;
    letter-spacing: 0.32em;
    text-align:center;
    color: var(--ink);
    margin-bottom: 30px;
  }

  /* ---- Essays ---- */
  .essay-item{
    margin-bottom: 26px;
    cursor:pointer;
  }
  .essay-head{
    display:flex;
    align-items:baseline;
    gap: 10px;
    flex-wrap:wrap;
  }
  .essay-title{
    font-family:'Lora', serif;
    font-size: 19px;
    color: var(--ink);
  }
  .essay-item.open .essay-title,
  .essay-item .essay-title.underline{
    text-decoration: underline;
    text-decoration-color: var(--hairline);
    text-underline-offset: 4px;
  }
  .stamp{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    padding: 2px 7px;
    border-radius: 3px;
    white-space:nowrap;
  }
  .stamp.private{ color: var(--private); background: var(--private-soft); border:1px solid var(--private-soft); }
  .stamp.public{ color: var(--public); background: var(--public-soft); border:1px solid var(--public-soft); }

  .essay-body{
    margin-top: 8px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 60ch;
  }
  .essay-locked{
    margin-top: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .essay-meta{
    margin-top: 6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .empty-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align:center;
    margin-top: 40px;
    line-height: 1.8;
  }

  /* ---- Social ---- */
  .post-card{ margin-bottom: 40px; }
  .post-img-wrap{
    width:100%;
    aspect-ratio: 16/9;
    overflow:hidden;
    background: #cfccc2;
    border: 1px solid var(--hairline);
  }
  .post-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .post-actions{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 12px;
  }
  .heart-btn{
    background:none; border:none; cursor:pointer; padding:0;
    color: var(--ink);
    display:flex; align-items:center;
  }
  .heart-btn svg{ width:20px; height:20px; }

  .like-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-left: -4px;
  }
  .post-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .post-caption{
    margin-top: 8px;
    font-size: 15.5px;
    color: var(--ink);
    line-height: 1.5;
  }
  .post-time{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(20,19,16,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal{
    background: var(--paper-raised);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--ink);
    padding: 28px 28px 24px;
    max-height: 88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 24px;
    letter-spacing: 0.06em;
    margin: 0 0 18px;
    text-align:center;
  }
  .tab-row{
    display:flex;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .tab-btn{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    padding: 9px 8px;
    background: transparent;
    border:none;
    cursor:pointer;
    color: var(--ink);
  }
  .tab-btn.active{ background: var(--ink); color: var(--paper); }

  label.field-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="url"], textarea{
    width:100%;
    font-family:'Lora', serif;
    font-size: 15px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    padding: 10px 11px;
    color: var(--ink);
    resize: vertical;
  }
  input:focus, textarea:focus{
    outline: none;
    border-color: var(--ink);
  }
  textarea{ min-height: 110px; line-height:1.5; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px;
    padding: 10px 12px;
    border: 1px solid var(--hairline);
  }
  .toggle-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
  }
  .switch{
    position:relative;
    width: 42px; height: 22px;
    border-radius: 999px;
    background: var(--public);
    cursor:pointer;
    transition: background .15s ease;
    flex-shrink:0;
  }
  .switch.is-private{ background: var(--private); }
  .switch .knob{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--paper);
    transition: left .15s ease;
  }
  .switch.is-private .knob{ left: 22px; }

  .modal-actions{
    display:flex; gap:10px; margin-top:24px;
  }
  .modal-actions button{ flex:1; }
  .btn-secondary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: transparent; border:1px solid var(--hairline); color: var(--ink-soft);
    padding: 10px; cursor:pointer;
  }
  .btn-primary{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
    background: var(--ink); border:1px solid var(--ink); color: var(--paper);
    padding: 10px; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }

  .field-error{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    margin-top: 6px;
  }

  @media (max-width: 760px){
    main{ grid-template-columns: 1fr; }
    .divider{ display:none; }
    .col{ padding: 26px 20px 40px; border-top: 1px solid var(--hairline); }
    .col:first-child{ border-top:none; }

    header{
      grid-template-columns: 1fr;
      row-gap: 14px;
      padding: 20px 16px 16px;
    }
    .wordmark{
      grid-column: 1;
      font-size: 18px;
      letter-spacing: 0.26em;
      text-indent: 0.26em;
    }
    .header-right{
      grid-column: 1;
      justify-self: stretch;
      width: 100%;
      justify-content: space-between;
      gap: 10px;
    }
    .rule{ margin: 0 16px; }
    .status-line{ padding: 8px 16px 0; }
  }

  @media (max-width: 360px){
    .wordmark{ font-size:16px; letter-spacing:0.18em; text-indent:0.18em; }
  }

  @media (max-width: 640px){
    .doc-topbar{ padding: 14px 16px; }
    .doc-toolbar{ padding: 8px 16px; gap: 6px; }
    .doc-tool-btn{ padding: 5px 8px; font-size: 11px; }
    .doc-body-wrap{ padding: 28px 18px 100px; }
    .doc-title-input, .doc-title-display{ font-size: 26px; }
    .doc-editable, .doc-read-body{ font-size: 16px; }
  }
</style>

<style>
  .auth-banner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 34px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--private);
    text-align:right;
    min-height: 16px;
  }
  .auth-toggle-text{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 18px;
  }
  .auth-toggle-text button{
    background:none; border:none; cursor:pointer;
    color: var(--ink); text-decoration: underline;
    font-family: inherit; font-size: inherit;
  }
  .spinner-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted); text-align:center; margin-top: 10px;
  }

  .image-picker{
    border: 1px dashed var(--hairline);
    padding: 14px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .image-picker input[type="file"]{ display:none; }
  .image-picker-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .image-picker-btn:hover{ background: var(--ink); color: var(--paper); }
  .image-picker-status{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .image-preview-wrap{
    position: relative;
    margin-top: 12px;
  }
  .image-preview-wrap img{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--hairline);
  }
  .image-preview-remove{
    position: absolute;
    top: 8px; right: 8px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 999px;
    width: 26px; height: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .upload-progress{
    margin-top: 10px;
    height: 4px;
    background: var(--hairline);
    overflow: hidden;
  }
  .upload-progress-bar{
    height: 100%;
    background: var(--private);
    width: 0%;
    transition: width .15s ease;
  }
  .or-divider{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin: 12px 0;
    letter-spacing: 0.1em;
  }

  .delete-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--muted);
    padding: 2px;
    display:flex;
    align-items:center;
    flex-shrink:0;
    margin-left: auto;
  }
  .delete-btn:hover{ color: var(--private); }

  .inline-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    background:none;
    border:none;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .inline-link:hover{ color: var(--private); }

  /* ---- full-page essay document (editor + reader) ---- */
  .doc-page{
    position: fixed;
    inset: 0;
    background: var(--paper);
    overflow-y: auto;
    z-index: 70;
  }
  .doc-topbar{
    position: sticky;
    top: 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    padding: 18px 24px;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
    z-index: 2;
  }
  .doc-topbar-left{ display:flex; align-items:center; gap:14px; }
  .doc-toolbar{
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap: 4px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--paper-raised);
  }
  .doc-tool-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--hairline);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 3px;
  }
  .doc-tool-btn:hover{ border-color: var(--ink); }
  .doc-body-wrap{
    max-width: 700px;
    margin: 0 auto;
    padding: 44px 24px 120px;
  }
  .doc-title-input{
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    padding: 0;
    margin-bottom: 8px;
  }
  .doc-title-input:focus{ outline: none; }
  .doc-title-display{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .doc-editable{
    min-height: 320px;
    font-family: 'Lora', serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .doc-editable:focus{ outline: none; }
  .doc-editable[data-placeholder]:empty:before{
    content: attr(data-placeholder);
    color: var(--muted);
  }
  .doc-editable p, .doc-editable div{ margin: 0 0 1em; }
  .doc-editable ul, .doc-editable ol{ margin: 0 0 1em; padding-left: 1.4em; }
  .doc-editable blockquote{
    margin: 0 0 1em;
    padding-left: 14px;
    border-left: 2px solid var(--hairline);
    color: var(--muted);
  }
  .doc-read-body{
    font-family: 'Lora', serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .doc-read-body p, .doc-read-body div{ margin: 0 0 1em; }
  .doc-read-body ul, .doc-read-body ol{ margin: 0 0 1em; padding-left: 1.4em; }
  .doc-read-body blockquote{
    margin: 0 0 1em;
    padding-left: 14px;
    border-left: 2px solid var(--hairline);
    color: var(--muted);
  }
  .doc-section-heading{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin: 44px 0 14px;
  }
  .doc-bib-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items:center;
  }
  .doc-bib-row input{ flex:1; }
  .doc-bib-list{
    font-family:'Lora', serif;
    font-size: 14.5px;
    color: var(--ink-soft);
  }
  .doc-bib-list li{ margin-bottom: 6px; }
  .doc-bib-list a{ color: var(--ink); }
  .doc-post-picker{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .doc-post-tile{
    flex: 0 0 auto;
    width: 96px;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 3px;
    border-radius: 4px;
  }
  .doc-post-tile.selected{ border-color: var(--private); }
  .doc-post-tile img{
    width: 90px; height: 90px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--hairline);
  }
  .doc-post-tile-caption{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-none-tile{
    flex: 0 0 auto;
    width: 90px; height: 90px;
    border: 1px dashed var(--hairline);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
  }
  .doc-none-tile.selected{ border: 2px solid var(--private); }
  .doc-embedded-post{
    margin-top: 14px;
    border: 1px solid var(--hairline);
    padding: 14px;
    cursor: pointer;
  }
  .doc-embedded-post img{
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    display: block;
    margin-bottom: 10px;
  }
</style>
